name: Sync preprod

on:
  push:
    branches: [master, preprod]

permissions:
  contents: write

# Never let two syncs race to force-push preprod; the newest push wins.
concurrency:
  group: sync-preprod
  cancel-in-progress: true

jobs:
  sync-preprod:
    name: build flutter for preprod and push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pushed branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build Flutter web app for preprod API
        working-directory: admin_saiseeds
        run: |
          flutter pub get
          flutter build web --release \
            --base-href /sales-admin/ \
            --dart-define=API_BASE_URL=https://sai-seeds-preprod.onrender.com
            # --dart-define=API_BASE_URL=https://sai-seeds-preprod-tzdp.onrender.com

      - name: Commit preprod build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add admin_saiseeds/build
          git diff --cached --quiet || git commit -m "Build Flutter web app for preprod API"

      # Preprod only: this job must never update master (that would trigger a
      # prod deploy). The target is pinned and checked before pushing.
      - name: Push to preprod
        env:
          TARGET_BRANCH: preprod
        run: |
          if [ "$TARGET_BRANCH" != "preprod" ]; then
            echo "Refusing to push to '$TARGET_BRANCH': this workflow only deploys preprod." >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/$TARGET_BRANCH" --force
