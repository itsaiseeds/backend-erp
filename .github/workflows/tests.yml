name: Tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env.dev
        shell: bash
        run: |
          cat > .env.dev <<'EOF'
          DEBUG=True
          SECRET_KEY=ci-secret-key-not-for-production
          ALLOWED_HOSTS=localhost,127.0.0.1
          POSTGRES_DB=django
          POSTGRES_USER=django
          POSTGRES_PASSWORD=change-this-password
          POSTGRES_HOST=db
          POSTGRES_PORT=5432
          EOF

      - name: Build Docker images
        run: docker compose build

      - name: Start services (db first, then web)
        run: docker compose up -d --wait

      - name: Run unit tests
        run: bash scripts/run.sh test-unit

      - name: Run integration tests
        run: bash scripts/run.sh test-integration

      - name: Lint
        run: bash scripts/run.sh lint

      - name: Teardown
        if: always()
        run: docker compose down -v