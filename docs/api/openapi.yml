components:
  schemas:
    AdminPayload:
      type: object
      description: Swagger schema for one admin row (no city, address or audit keys).
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          nullable: true
        phone_number:
          type: string
        role:
          type: string
        created_by:
          allOf:
          - $ref: '#/components/schemas/UserRef'
          nullable: true
        created_at:
          type: string
          format: date-time
        can_update_stock_count:
          type: boolean
        totp:
          $ref: '#/components/schemas/Totp'
      required:
      - can_update_stock_count
      - created_at
      - id
      - name
      - phone_number
      - role
    AdminUpdateClientRequest:
      type: object
      description: Request validation for an admin's client update -- every field
        optional.
      properties:
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/ClientAddressRequest'
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/ClientContactRequest'
        transport_agencies:
          type: array
          items:
            $ref: '#/components/schemas/ClientTransportAgencyRequest'
        public_id:
          type: string
          minLength: 1
          maxLength: 20
        company_name:
          type: string
          minLength: 1
          maxLength: 255
        company_phone:
          type: string
          maxLength: 10
        gst_number:
          type: string
          minLength: 1
          maxLength: 15
      required:
      - public_id
    AndroidCity:
      type: object
      description: Output shape for one city row (schema only; responses are built
        by hand).
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    AndroidCountry:
      type: object
      description: Output shape for one country row (schema only; responses are built
        by hand).
      properties:
        id:
          type: integer
        name:
          type: string
        iso_code:
          type: string
      required:
      - id
      - iso_code
      - name
    AndroidReauthenticateResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/AndroidReauthenticateUser'
      required:
      - user
    AndroidReauthenticateUser:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        phone_number:
          type: string
        role:
          type: string
      required:
      - id
      - name
      - phone_number
      - role
    AndroidState:
      type: object
      description: Output shape for a state and its cities (schema only).
      properties:
        id:
          type: integer
        name:
          type: string
        cities:
          type: array
          items:
            $ref: '#/components/schemas/AndroidCity'
      required:
      - cities
      - id
      - name
    AndroidStateRef:
      type: object
      description: Output shape for one state row (schema only; responses are built
        by hand).
      properties:
        id:
          type: integer
        name:
          type: string
        code:
          type: string
          nullable: true
        country_id:
          type: integer
      required:
      - code
      - country_id
      - id
      - name
    BagOrderItemRequest:
      type: object
      description: 'One line of the order: a bag and how many of it.'
      properties:
        product_packaging_public_id:
          type: string
          minLength: 1
          maxLength: 20
        quantity:
          type: integer
          minimum: 1
      required:
      - product_packaging_public_id
      - quantity
    CatalogueItem:
      type: object
      description: Output shape for one catalogue row -- a bag (schema only).
      properties:
        public_id:
          type: string
          description: Send this as product_packaging_public_id when creating an order.
        name:
          type: string
        packets:
          type: integer
          description: Packets in one bag.
        packet_weight:
          type: string
          description: Weight of one packet, in kg.
        total_weight:
          type: string
          description: Weight of the whole bag, in kg.
        selling_price:
          type: string
          description: Price of the whole bag.
        product:
          $ref: '#/components/schemas/CatalogueProduct'
      required:
      - name
      - packet_weight
      - packets
      - product
      - public_id
      - selling_price
      - total_weight
    CataloguePage:
      type: object
      description: Output shape for the paginated envelope (schema only).
      properties:
        total_count:
          type: integer
        total_pages:
          type: integer
        next_page_number:
          type: integer
          nullable: true
        previous_page_number:
          type: integer
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/CatalogueItem'
        available_filters:
          type: array
          items:
            $ref: '#/components/schemas/FilterCatalogueEntry'
        available_sorts:
          type: array
          items:
            $ref: '#/components/schemas/SortCatalogueEntry'
      required:
      - available_filters
      - available_sorts
      - next_page_number
      - previous_page_number
      - results
      - total_count
      - total_pages
    CatalogueProduct:
      type: object
      description: Output shape for the product card on a catalogue row (schema only).
      properties:
        public_id:
          type: string
        name:
          type: string
        crop:
          type: string
          nullable: true
        stage:
          $ref: '#/components/schemas/CatalogueStage'
        image_url:
          type: string
        description_items:
          type: array
          items:
            type: string
      required:
      - crop
      - description_items
      - image_url
      - name
      - public_id
      - stage
    CatalogueStage:
      type: object
      description: Output shape for the ``stage`` reference on a catalogue row.
      properties:
        code:
          type: string
        name:
          type: string
        sequence:
          type: integer
      required:
      - code
      - name
      - sequence
    CheckTodaysInventoryPayload:
      type: object
      description: Output shape for the readiness report.
      properties:
        is_complete:
          type: boolean
        snapshot_date:
          type: string
          format: date
        loose_snapshot_date:
          type: string
          format: date
          nullable: true
        missing_packagings:
          type: array
          items:
            $ref: '#/components/schemas/MissingPackaging'
        stock_admins:
          type: array
          items:
            $ref: '#/components/schemas/StockAdmin'
      required:
      - is_complete
      - loose_snapshot_date
      - missing_packagings
      - snapshot_date
      - stock_admins
    City:
      type: object
      description: Output shape for one city row (schema only; responses are built
        by hand).
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    CityRef:
      type: object
      description: Swagger schema for a compact ``{id, name}`` city reference.
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    ClientAddressLink:
      type: object
      description: Output shape for one client-address link (schema only).
      properties:
        id:
          type: integer
          description: This link's id. Send it as client_address_id when creating
            an order.
        label:
          type: string
        is_primary:
          type: boolean
        line_1:
          type: string
        line_2:
          type: string
        pincode:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
        city_id:
          type: integer
        state_id:
          type: integer
        country_id:
          type: integer
      required:
      - city
      - city_id
      - country
      - country_id
      - id
      - is_primary
      - label
      - line_1
      - line_2
      - pincode
      - state
      - state_id
    ClientAddressPayload:
      type: object
      description: Output shape for one client address (schema only).
      properties:
        label:
          type: string
        is_primary:
          type: boolean
        line_1:
          type: string
        line_2:
          type: string
        pincode:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
        city_id:
          type: integer
        state_id:
          type: integer
        country_id:
          type: integer
      required:
      - city
      - city_id
      - country
      - country_id
      - is_primary
      - label
      - line_1
      - line_2
      - pincode
      - state
      - state_id
    ClientAddressRequest:
      type: object
      description: |-
        One address of a client.

        City, state and country are master data and must already exist; the pincode
        is typed in by the sales person and is created on demand.
        ``Address.clean()`` then checks the whole pincode -> city -> state ->
        country chain hangs together.
      properties:
        line_1:
          type: string
          minLength: 1
          maxLength: 255
        line_2:
          type: string
          default: ''
          maxLength: 255
        pincode:
          type: string
          minLength: 1
          maxLength: 10
        city:
          type: integer
        state:
          type: integer
        country:
          type: integer
        label:
          type: string
          default: ''
          maxLength: 64
        is_primary:
          type: boolean
          default: false
      required:
      - city
      - country
      - line_1
      - pincode
      - state
    ClientContactPayload:
      type: object
      description: Output shape for one client contact (schema only).
      properties:
        name:
          type: string
        phone_number:
          type: string
        role:
          type: string
        is_primary:
          type: boolean
      required:
      - is_primary
      - name
      - phone_number
      - role
    ClientContactRequest:
      type: object
      description: One contact person of a client.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        phone_number:
          type: string
          minLength: 1
          maxLength: 10
        role:
          type: string
          default: ''
          maxLength: 64
        is_primary:
          type: boolean
          default: false
      required:
      - name
      - phone_number
    ClientListItem:
      type: object
      description: Output shape for one client card (schema only).
      properties:
        public_id:
          type: string
        company_name:
          type: string
        company_phone:
          type: string
        status:
          type: string
          nullable: true
        primary_contact:
          allOf:
          - $ref: '#/components/schemas/ClientContactPayload'
          nullable: true
        primary_address:
