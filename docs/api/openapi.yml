    FarmerPayload:
      type: object
      description: |-
        Output shape for one farmer across every trip.

        A farmer is one ``contact_number``, whatever the number of trips they were
        recorded on: ``farmer_name`` / ``village`` / ``city`` / ``land_area_bigha``
        come from their latest visit, while ``crops`` / ``products`` are merged over
        all of them and ``visits`` lists the meetings behind the row.
        ``FieldTripOperations.farmer_payload`` builds it.
      properties:
        contact_number:
          type: string
          description: The farmer's identity across trips.
        farmer_name:
          type: string
          description: Name given at the latest visit.
        village:
          type: string
          description: Village of the latest visit.
        city:
          allOf:
          - $ref: '#/components/schemas/IdName'
          description: City of the latest visit's field trip.
        land_area_bigha:
          type: string
          description: Land held at the latest visit, in bigha.
        crops:
          type: array
          items:
            $ref: '#/components/schemas/IdName'
          description: Every crop they grow, merged over visits.
        uses_our_products:
          type: boolean
        products:
          type: array
          items:
            $ref: '#/components/schemas/ProductRef'
