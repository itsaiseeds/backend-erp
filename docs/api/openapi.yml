          type: string
      required:
      - line_total
      - negotiated_selling_price
      - packet_weight
      - packets
      - product
    CustomOrderItemWriteRequest:
      type: object
      description: 'One line of a custom order: loose packets of one product at one
        weight.'
      properties:
        product_public_id:
          type: string
          minLength: 1
          maxLength: 20
        packet_weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,3})?$
          description: 'Weight of one packet, in kg. Selects the loose pool the line
            draws from: 1kg and 0.5kg packets are separate stock.'
        packets:
          type: integer
          minimum: 1
        negotiated_selling_price:
          type: string
