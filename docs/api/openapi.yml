        name:
          type: string
          minLength: 1
          maxLength: 255
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        phone_number:
          type: string
          minLength: 1
          maxLength: 10
        can_update_stock_count:
          type: boolean
    PatchedUpdateCropRequest:
      type: object
      description: Request validation for updating a ``Crop`` (name only).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
