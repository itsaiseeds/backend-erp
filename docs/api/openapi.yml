  /android/api/v1/godown/update-bag-stock:
    post:
      operationId: android_api_v1_godown_update_bag_stock
      description: 'Sealed-bag counts only: every active packaging of a usable product
        receives a snapshot row for today, and packagings absent from ``counts`` are
        recorded as zero bags. Packagings of an unusable product cannot be counted
        (naming one is a 400); their last figure is carried forward. Loose packets
        are not accepted here -- record them at ``/android/api/v1/godown/update-sample-packet-stock``.'
      summary: Replace today's entire sealed-bag stock count
      tags:
      - Android · Godown
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTodaysInventoryRequest'
            examples:
              Whole-dayBagCount:
                value:
                  counts:
                    PP-A1B2C3D4E0F1: 12
                    PP-A1B2C3D4E0F2: 0
                summary: Whole-day bag count
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UpdateTodaysInventoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateTodaysInventoryRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SnapshotPayload'
          description: ''
    patch:
      operationId: android_api_v1_godown_update_bag_stock_partial
      description: 'Sealed-bag counts only: only the packagings named in ``counts``
        are written; the rest of today''s rows are left as they are. Loose packets
        are not accepted here -- record them at ``/android/api/v1/godown/update-sample-packet-stock``.'
      summary: Partially update today's sealed-bag stock count
      tags:
      - Android · Godown
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateTodaysInventoryRequest'
            examples:
              PartialBagCount:
                value:
                  counts:
                    PP-A1B2C3D4E0F1: 12
                summary: Partial bag count
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateTodaysInventoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateTodaysInventoryRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SnapshotPayload'
          description: ''
  /android/api/v1/godown/update-sample-packet-stock:
    post:
      operationId: android_api_v1_godown_update_sample_packet_stock
      description: Every (product, packet_weight) pair the business packs receives
        a loose row for today. Pairs absent from ``counts`` are recorded as zero packets.
        Does not touch the sealed-bag snapshot.
      summary: Replace the whole loose-packet stock count
      tags:
      - Android · Godown
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLooseStockRequest'
            examples:
              Whole-dayLooseCount:
                value:
                  counts:
                  - product: P-A1B2C3D4E0F1
                    packet_weight: '1.000'
                    packets: 12
                  - product: P-A1B2C3D4E0F1
                    packet_weight: '0.500'
                    packets: 0
                summary: Whole-day loose count
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UpdateLooseStockRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateLooseStockRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LooseStockPayload'
          description: ''
    patch:
      operationId: android_api_v1_godown_update_sample_packet_stock_partial
      description: Only the pairs named in ``counts`` are written; every other loose
        row is left as it is.
      summary: Partially update the loose-packet stock count
      tags:
      - Android · Godown
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateLooseStockRequest'
            examples:
              PartialLooseCount:
                value:
                  counts:
                  - product: P-A1B2C3D4E0F1
                    packet_weight: '1.000'
                    packets: 12
                summary: Partial loose count
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateLooseStockRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateLooseStockRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LooseStockPayload'
          description: ''
