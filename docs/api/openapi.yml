          description: Kilograms of this product in this status.
        DISPATCHED:
          type: string
          description: Kilograms of this product in this status.
        DELIVERED:
          type: string
          description: Kilograms of this product in this status.
        ON_HOLD:
          type: string
          description: Kilograms of this product in this status.
        REJECTED:
          type: string
          description: Kilograms of this product in this status.
      required:
      - BOOKED
      - CONFIRMED
      - DELIVERED
      - DISPATCHED
      - ON_HOLD
      - REJECTED
