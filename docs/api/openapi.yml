openapi: 3.0.3
info:
  title: SaiSeeds ERP API
  version: 1.0.0
  description: Backend API for the SaiSeeds sales admin website and salesperson Android
    app. Auto-generated from the codebase.
paths:
  /android/api/v1/analytics:
    get:
      operationId: android_api_v1_analytics_retrieve
      description: Order / client counts and per-product kilograms for the caller
        in a window.
      summary: Order / client counts by status, and kg booked per product, in a window
      parameters:
      - in: query
        name: end_date_time
        schema:
          type: string
        description: ISO 8601.
        required: true
      - in: query
        name: start_date_time
        schema:
          type: string
        description: ISO 8601.
        required: true
      tags:
      - Android · Orders
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsResponse'
          description: ''
  /android/api/v1/auth/login:
    post:
      operationId: android_api_v1_auth_login_create
      description: Validate a TOTP code, then issue a bearer token for that sales
        person or godown manager.
      tags:
      - Android · Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Invalid phone number or TOTP code.
          description: ''
        '429':
          content:
            application/json:
              schema:
                description: Too many requests from this IP; retry later.
          description: ''
  /android/api/v1/auth/logout:
    post:
      operationId: android_api_v1_auth_logout_create
      description: |-
        Revoke the caller's bearer token and forget their push devices.

        The token is one per user, so logging out signs the user out everywhere;
        their FCM tokens go with it, or a logged-out phone would keep receiving
        their notifications.

        Logout must succeed for anyone the token authentication accepts, so this
        view relaxes the ``salesperson_required`` gate inherited from
        ``AndroidBaseView``. Otherwise a user whose ``SalesPerson`` profile has
        been soft-deleted (or has already been logged out server-side) would be
        unable to revoke their still-valid token, leaving it live for the rest of
        ``TOKEN_TTL_HOURS``.
      summary: Revoke the caller's bearer token
      tags:
      - Android · Auth
      security:
      - bearerAuth: []
      responses:
        '204':
          content:
            application/json:
              schema:
                description: Token revoked.
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Missing or invalid token.
          description: ''
  /android/api/v1/auth/reauthenticate:
    get:
      operationId: android_api_v1_auth_reauthenticate_retrieve
      description: Confirm the caller's bearer token is still valid.
      summary: Check whether the caller's bearer token is still valid
      tags:
      - Android · Auth
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AndroidReauthenticateResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Missing, expired, or revoked token.
          description: ''
  /android/api/v1/client/{public_id}:
    get:
      operationId: android_api_v1_client_retrieve
      description: Full detail of one of the caller's clients, by ``public_id``.
      summary: Get one of my clients in full (core + all addresses/contacts/agencies)
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
        description: The client's public id, e.g. C-E79QA0E2OIHF.
        required: true
      tags:
      - Android · Clients
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientPayload'
          description: ''
  /android/api/v1/create-client:
    post:
      operationId: android_api_v1_create_client_create
      description: Create a client owned by the calling sales person.
      summary: Create a client
      tags:
      - Android · Clients
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClientRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateClientRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateClientRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientPayload'
          description: ''
  /android/api/v1/create-farmer-visit:
    post:
      operationId: android_api_v1_create_farmer_visit_create
      description: Record a farmer met on the caller's in-progress field trip.
      summary: Record a farmer met on my in-progress field trip
      tags:
      - Android · Field trips
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFarmerVisitRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateFarmerVisitRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateFarmerVisitRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmerVisitPayload'
          description: ''
  /android/api/v1/create-field-trip:
    post:
      operationId: android_api_v1_create_field_trip_create
      description: Plan a field trip (born PLANNED).
      summary: Plan a field trip
      tags:
      - Android · Field trips
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FieldTripWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FieldTripWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FieldTripWriteRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldTripPayload'
          description: ''
  /android/api/v1/create-multi-select-bag-order:
    post:
      operationId: android_api_v1_create_multi_select_bag_order
      description: Book an order of sealed bags for one of the caller's clients.
      summary: Book an order from multi-selected catalogue bags
      tags:
      - Android · Orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMultiSelectBagOrderRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateMultiSelectBagOrderRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateMultiSelectBagOrderRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPayload'
          description: ''
  /android/api/v1/delete-field-trip/{public_id}:
    delete:
      operationId: android_api_v1_delete_field_trip_destroy
      description: Delete the caller's field trip that has not started.
      summary: Delete my field trip (PLANNED or APPROVED only)
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
        description: The public id of one of your field trips, e.g. FT-E79QA0E2OIHF.
        required: true
      tags:
      - Android · Field trips
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
  /android/api/v1/devices/register:
    post:
      operationId: android_api_v1_devices_register_create
      description: Register (or refresh) the caller's FCM token.
      summary: Register this device for push notifications
      tags:
      - Android · Notifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDeviceRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterDeviceRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterDeviceRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '204':
          content:
            application/json:
              schema:
                description: Device registered.
          description: ''
  /android/api/v1/edit-farmer-visit/{public_id}:
    patch:
      operationId: android_api_v1_edit_farmer_visit_partial_update
      description: Rename a farmer recorded on the caller's in-progress field trip.
      summary: Rename a farmer on my in-progress field trip
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
        description: The farmer visit's public id (FV-…).
        required: true
      tags:
      - Android · Field trips
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEditFarmerVisitRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedEditFarmerVisitRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEditFarmerVisitRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmerVisitPayload'
          description: ''
  /android/api/v1/edit-field-trip/{public_id}:
    patch:
      operationId: android_api_v1_edit_field_trip_partial_update
      description: Edit the plan of the caller's PLANNED or APPROVED field trip.
      summary: Edit my field trip's plan (an approved trip returns to PLANNED)
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
        description: The public id of one of your field trips, e.g. FT-E79QA0E2OIHF.
        required: true
      tags:
      - Android · Field trips
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedFieldTripWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedFieldTripWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedFieldTripWriteRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldTripPayload'
          description: ''
  /android/api/v1/end-field-trip/{public_id}:
    post:
      operationId: android_api_v1_end_field_trip_create
      description: End the caller's in-progress field trip (IN_PROGRESS -> COMPLETED).
      summary: End my field trip (IN_PROGRESS -> COMPLETED)
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
        description: The public id of one of your field trips, e.g. FT-E79QA0E2OIHF.
        required: true
      tags:
      - Android · Field trips
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldTripPayload'
          description: ''
  /android/api/v1/field-trip-farmer-visits/{public_id}:
    get:
      operationId: android_api_v1_get_field_trip_farmer_visits_list
      description: List the farmers recorded on one of the caller's field trips.
      summary: List the farmers recorded on my field trip
      parameters:
      - in: query
        name: all
        schema:
          type: boolean
          default: false
        description: When true, ignore page / page_size and return every row matching
          the filters as a single page (total_pages 1, page numbers null).
      - in: query
        name: crop
        schema:
          type: string
        description: Crop id(s) the farmer grows (see options). Comma-separated (any
          match); AND-ed with the other filters.
      - in: query
        name: page
        schema:
          type: integer
        description: 1-based page number.
      - in: query
        name: page_size
        schema:
          type: integer
        description: Rows per page (default 10, max 100).
      - in: query
        name: product
        schema:
          type: string
        description: Product public id(s) the farmer uses (see options). Comma-separated
          (any match); AND-ed with the other filters.
      - in: path
        name: public_id
        schema:
          type: string
        description: The public id of one of your field trips, e.g. FT-E79QA0E2OIHF.
        required: true
      - in: query
        name: public_id
        schema:
          type: string
        description: Case-insensitive substring of the public id (FV-XXXXXXXXXXXX).
          Single value; AND-ed with the other filters.
      - in: query
        name: sort
        schema:
          type: string
        description: Comma-separated sort keys (created_at, land_area, farmer_name);
          prefix a key with '-' for descending. Defaults to the view's natural order.
      - in: query
        name: uses_our_products
        schema:
          type: string
        description: 'true: farmers using at least one of our products; false: none.
          Single value; AND-ed with the other filters.'
      tags:
      - Android · Field trips
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmerVisitPage'
          description: ''
  /android/api/v1/get-challan/{order_public_id}:
    get:
      operationId: android_api_v1_get_challan_retrieve
      description: The challan of one of the caller's dispatched or delivered orders.
      summary: Get the dispatch challan of one of my orders
      parameters:
      - in: path
        name: order_public_id
        schema:
          type: string
        description: The order's public id, e.g. ORD-E79QA0E2OIHF.
        required: true
      tags:
      - Android · Orders
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchChallanItem'
          description: ''
  /android/api/v1/get-challans:
    get:
      operationId: android_api_v1_get_challans_list
      description: List the challans of the caller's dispatched or delivered orders.
      summary: List my dispatch challans (filter by client / city / status, sortable)
      parameters:
      - in: query
        name: all
        schema:
          type: boolean
          default: false
        description: When true, ignore page / page_size and return every row matching
          the filters as a single page (total_pages 1, page numbers null).
      - in: query
        name: challan_number
        schema:
          type: string
        description: Case-insensitive substring of the challan number (YYYYMMDD-XXXX).
          The date window still applies -- the number carries its own date. Single
          value; AND-ed with the other filters.
      - in: query
        name: city_id
        schema:
          type: string
        description: City id(s) the goods were sent to (see options). Comma-separated
          (any match); AND-ed with the other filters.
      - in: query
        name: client
        schema:
          type: string
        description: Client public id(s) the goods were consigned to (see options).
          Comma-separated (any match); AND-ed with the other filters.
      - in: query
        name: end_date_time
        schema:
          type: string
          format: date-time
        description: ISO 8601. End date time of the window.
        required: true
      - in: query
        name: page
        schema:
          type: integer
        description: 1-based page number.
      - in: query
        name: page_size
        schema:
          type: integer
        description: Rows per page (default 10, max 100).
      - in: query
        name: public_id
        schema:
          type: string
        description: Case-insensitive substring of the public id (DE-XXXXXXXXXXXX).
          Single value; AND-ed with the other filters.
      - in: query
        name: sort
        schema:
          type: string
        description: Comma-separated sort keys (dispatch_date, created_at); prefix
          a key with '-' for descending. Defaults to the view's natural order.
      - in: query
        name: start_date_time
        schema:
          type: string
          format: date-time
        description: ISO 8601. Start date time of the window.
        required: true
      - in: query
        name: status
        schema:
          type: string
        description: Whether the order is still DISPATCHED or already DELIVERED. Comma-separated
          (any match); AND-ed with the other filters.
      tags:
      - Android · Orders
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallanPage'
          description: ''
  /android/api/v1/get-clients:
    get:
      operationId: android_api_v1_get_clients_list
      description: 'List the caller''s clients: filter by city / status / created
        window, sort.'
      summary: List my clients (filter by city / status / name / address / created,
        sortable)
      parameters:
      - in: query
        name: address
        schema:
          type: string
        description: Case-insensitive substring of the primary address (line 1/2,
          pincode or city). Single value; AND-ed with the other filters.
      - in: query
        name: all
        schema:
          type: boolean
          default: false
        description: When true, ignore page / page_size and return every row matching
          the filters as a single page (total_pages 1, page numbers null).
      - in: query
        name: city_id
        schema:
          type: string
        description: City id(s) of the client's primary address (see options). Comma-separated
          (any match); AND-ed with the other filters.
      - in: query
        name: company_name
        schema:
          type: string
        description: Case-insensitive substring of the company name. Single value;
          AND-ed with the other filters.
      - in: query
        name: created_gte
        schema:
          type: string
          format: date-time
        description: When the client was added (ISO 8601). Inclusive lower bound.
      - in: query
        name: created_lte
        schema:
          type: string
          format: date-time
        description: When the client was added (ISO 8601). Inclusive upper bound.
      - in: query
        name: page
        schema:
          type: integer
        description: 1-based page number.
      - in: query
        name: page_size
        schema:
          type: integer
        description: Rows per page (default 10, max 100).
      - in: query
        name: public_id
        schema:
          type: string
        description: Case-insensitive substring of the public id (C-XXXXXXXXXXXX).
          Single value; AND-ed with the other filters.
      - in: query
        name: sort
        schema:
          type: string
        description: Comma-separated sort keys (created_at, company_name); prefix
          a key with '-' for descending. Defaults to the view's natural order.
      - in: query
        name: status
        schema:
          type: string
        description: Client verification status. Comma-separated (any match); AND-ed
          with the other filters.
      tags:
      - Android · Clients
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientListPage'
          description: ''
  /android/api/v1/get-field-trips:
    get:
      operationId: android_api_v1_get_field_trips_list
      description: 'List the caller''s field trips: filter by status / city / village
        / dates.'
      summary: List my field trips (filter by status / city / village / dates)
      parameters:
      - in: query
        name: all
        schema:
          type: boolean
          default: false
        description: When true, ignore page / page_size and return every row matching
          the filters as a single page (total_pages 1, page numbers null).
      - in: query
        name: city_id
        schema:
          type: string
        description: City id(s) the trip goes to (see options). Comma-separated (any
          match); AND-ed with the other filters.
      - in: query
        name: expected_start_gte
        schema:
          type: string
          format: date-time
        description: When the trip is planned to start (inclusive bounds). Inclusive
          lower bound.
      - in: query
        name: expected_start_lte
        schema:
          type: string
          format: date-time
        description: When the trip is planned to start (inclusive bounds). Inclusive
          upper bound.
      - in: query
        name: page
        schema:
          type: integer
        description: 1-based page number.
      - in: query
        name: page_size
        schema:
          type: integer
        description: Rows per page (default 10, max 100).
      - in: query
        name: public_id
        schema:
          type: string
        description: Case-insensitive substring of the public id (FT-XXXXXXXXXXXX).
          Single value; AND-ed with the other filters.
      - in: query
        name: sort
        schema:
          type: string
        description: Comma-separated sort keys (expected_start_at, created_at); prefix
          a key with '-' for descending. Defaults to the view's natural order.
      - in: query
        name: status
        schema:
          type: string
        description: Field-trip lifecycle status. Comma-separated (any match); AND-ed
          with the other filters.
      - in: query
        name: village
        schema:
          type: string
        description: Case-insensitive substring of the village name. Single value;
          AND-ed with the other filters.
      tags:
      - Android · Field trips
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldTripPage'
          description: ''
  /android/api/v1/get-orders:
    get:
      operationId: android_api_v1_get_orders_list
      description: 'List the caller''s orders: filter by client / product / city /
        status, sort.'
      summary: List my orders (filter by client / product / city / status, sortable)
      parameters:
      - in: query
        name: all
        schema:
          type: boolean
          default: false
        description: When true, ignore page / page_size and return every row matching
          the filters as a single page (total_pages 1, page numbers null).
      - in: query
        name: city_id
        schema:
          type: string
        description: City id(s) the order is delivered to (see options). Comma-separated
          (any match); AND-ed with the other filters.
      - in: query
        name: client
        schema:
          type: string
        description: Client public id(s) the order was booked for (see options). Comma-separated
          (any match); AND-ed with the other filters.
      - in: query
        name: page
        schema:
          type: integer
        description: 1-based page number.
      - in: query
        name: page_size
        schema:
          type: integer
        description: Rows per page (default 10, max 100).
      - in: query
        name: product
        schema:
          type: string
        description: Product public id(s) the order contains (see options). Comma-separated
          (any match); AND-ed with the other filters.
      - in: query
        name: public_id
        schema:
          type: string
        description: Case-insensitive substring of the public id (ORD-XXXXXXXXXXXX).
          Single value; AND-ed with the other filters.
      - in: query
        name: sort
        schema:
          type: string
        description: Comma-separated sort keys (created_at, price); prefix a key with
          '-' for descending. Defaults to the view's natural order.
      - in: query
        name: status
        schema:
          type: string
        description: Order lifecycle status. Comma-separated (any match); AND-ed with
          the other filters.
      tags:
      - Android · Orders
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListPage'
          description: ''
  /android/api/v1/get-return-orders:
    get:
      operationId: android_api_v1_get_return_orders_list
      description: 'List the caller''s own returns: filter by order / status, sort.'
      summary: List my returns (filter by order / status, sortable)
      parameters:
      - in: query
        name: all
        schema:
          type: boolean
          default: false
        description: When true, ignore page / page_size and return every row matching
          the filters as a single page (total_pages 1, page numbers null).
      - in: query
        name: order
        schema:
          type: string
        description: Public id(s) of the order the return is against. Comma-separated
          (any match); AND-ed with the other filters.
      - in: query
        name: page
        schema:
          type: integer
        description: 1-based page number.
      - in: query
        name: page_size
        schema:
          type: integer
        description: Rows per page (default 10, max 100).
      - in: query
        name: public_id
        schema:
          type: string
