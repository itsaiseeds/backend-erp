        * `COMPLETED` - COMPLETED
    FieldTripWriteRequest:
      type: object
      description: |-
        A trip's plan: where and when. Every field is required on create; an
        edit validates it with ``partial=True`` and applies only what was sent.

        That the expected end falls after the expected start is checked on the
        merged trip by ``FieldTrip.clean()``, so a partial edit sending only one
        bound is still judged against the other.
      properties:
        city_id:
          type: integer
          description: A city id from utilities/cities.
        village:
          type: string
          minLength: 1
          maxLength: 255
        expected_start_at:
          type: string
          format: date-time
        expected_end_at:
          type: string
          format: date-time
      required:
      - city_id
      - expected_end_at
      - expected_start_at
      - village
