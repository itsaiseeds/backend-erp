      description: 'List every custom order: filter by admin / client / product /
        city / status.'
      summary: List custom orders (filter by sales admin / client / product / city
        / status, sortable)
      parameters:
      - in: query
        name: all
        schema:
          type: boolean
          default: false
        description: When true, ignore page / page_size and return every row matching
          the filters as a single page (total_pages 1, page numbers null).
      - in: query
        name: city_id
        schema:
          type: string
        description: City id(s) the custom order is delivered to (see options). Comma-separated
          (any match); AND-ed with the other filters.
      - in: query
        name: client
        schema:
          type: string
        description: Client id(s) the custom order was booked for (see options). Comma-separated
          (any match); AND-ed with the other filters.
      - in: query
        name: created_by
        schema:
          type: string
        description: User id(s) of the sales admin who booked the custom order (see
          options). Comma-separated (any match); AND-ed with the other filters.
      - in: query
        name: page
        schema:
          type: integer
        description: 1-based page number.
      - in: query
        name: page_size
        schema:
          type: integer
        description: Rows per page (default 10, max 100).
      - in: query
        name: product
        schema:
          type: string
        description: Product id(s) the custom order contains (see options). Comma-separated
          (any match); AND-ed with the other filters.
      - in: query
        name: public_id
        schema:
          type: string
        description: Case-insensitive substring of the public id (CORD-XXXXXXXXXXXX).
          Single value; AND-ed with the other filters.
      - in: query
        name: sort
        schema:
          type: string
        description: Comma-separated sort keys (created_at, price); prefix a key with
          '-' for descending. Defaults to the view's natural order.
      - in: query
        name: status
        schema:
          type: string
        description: Order lifecycle status. Comma-separated (any match); AND-ed with
          the other filters.
      tags:
      - Admin · Orders
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomOrderListPage'
          description: ''
