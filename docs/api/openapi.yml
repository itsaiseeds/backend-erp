          type: string
          description: Send this in ?sort= ('-' prefix for descending).
        label:
          type: string
          description: Human-readable name for the menu entry.
        description:
          type: string
      required:
      - description
      - label
      - sort
    StageRef:
      type: object
      description: Output shape for the ``stage`` reference on a product.
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
      required:
      - code
      - id
      - name
    State:
      type: object
      description: Output shape for a state and its cities (schema only).
      properties:
        id:
          type: integer
        name:
          type: string
        cities:
          type: array
          items:
            $ref: '#/components/schemas/City'
      required:
      - cities
      - id
      - name
    StockAdmin:
      type: object
      description: Output shape for one admin authorised to record the daily count.
      properties:
        name:
          type: string
        phone_number:
          type: string
      required:
      - name
      - phone_number
    StockPayload:
      type: object
      description: Output shape for a stock position (bag or loose-packet line).
      properties:
        public_id:
          type: string
        name:
          type: string
        snapshot_date:
          type: string
          format: date
        on_hand:
          type: integer
        reserved:
          type: integer
        consumed:
          type: integer
        available:
          type: integer
      required:
      - available
      - consumed
      - on_hand
      - public_id
      - reserved
      - snapshot_date
    StockPosition:
      oneOf:
      - $ref: '#/components/schemas/StockPayload'
      - $ref: '#/components/schemas/ProductLooseStockPayload'
    Totp:
      type: object
      description: Swagger schema for a user's TOTP provisioning URI (used to render
        a QR code).
      properties:
        provisioning_uri:
          type: string
      required:
      - provisioning_uri
    TransportAgencyRef:
      type: object
      description: Output shape for the ``transport_agency`` reference on an order.
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    UpdateClientRequest:
      type: object
      description: Request validation for a sales person's client update.
      properties:
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/ClientAddressRequest'
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/ClientContactRequest'
        transport_agencies:
          type: array
          items:
            $ref: '#/components/schemas/ClientTransportAgencyRequest'
        public_id:
          type: string
          minLength: 1
          maxLength: 20
      required:
      - addresses
      - contacts
      - public_id
      - transport_agencies
    UpdateLooseStockRequest:
      type: object
      description: 'Request validation: a list of loose lines.'
      properties:
        counts:
          type: array
          items:
            $ref: '#/components/schemas/LooseCountLineRequest'
          description: Loose lines, one per (product, packet_weight) pair.
      required:
      - counts
    UpdateTodaysInventoryRequest:
      type: object
      description: 'Request validation: a map of packaging ``public_id`` → today''s
        bag count.'
      properties:
        counts:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
          description: Map of product-packaging public_id to its bag count.
      required:
      - counts
    UserRef:
      type: object
      description: Swagger schema for a compact ``{id, name}`` user reference.
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    VerifyClientRequest:
      type: object
      description: Request validation for verifying a client.
      properties:
        public_id:
          type: string
          minLength: 1
          maxLength: 20
      required:
      - public_id
    VerifyOTPRequest:
      type: object
      properties:
        phone_number:
          type: string
          minLength: 1
          maxLength: 10
        otp:
          type: string
          minLength: 1
          maxLength: 8
      required:
      - otp
      - phone_number
    VerifyOTPResponse:
      type: object
      description: |-
        User payload returned after a successful TOTP exchange.

        The session cookie itself is set via ``Set-Cookie`` (see ``login()``
        below), not returned in the body.
      properties:
        user:
          $ref: '#/components/schemas/VerifyOTPUser'
        can_create_admin:
          type: boolean
        can_create_sales_person:
          type: boolean
      required:
      - can_create_admin
      - can_create_sales_person
      - user
    VerifyOTPUser:
      type: object
      description: The authenticated user, as returned by the login flow.
      properties:
        id:
          type: integer
        name:
          type: string
        phone_number:
          type: string
        role:
          type: string
      required:
      - id
      - name
      - phone_number
      - role
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token
      description: Expiring bearer token used by the Android app.
    sessionAuth:
      type: apiKey
      in: header
      name: sessionid
      description: Django session cookie for the sales admin website.
