      properties:
        public_id:
          type: string
        created_at:
          type: string
          format: date-time
        status:
          type: string
          nullable: true
        client:
          $ref: '#/components/schemas/CustomOrderListClient'
        client_created_by:
          type: string
          nullable: true
          description: Sales person who onboarded the client.
        created_by:
          type: string
          nullable: true
          description: Sales admin who booked the custom order.
        verified_by:
          type: string
          nullable: true
          description: Sales admin who confirmed it -- the booking admin, by construction.
        delivery_address:
