          type: string
        company_name:
          type: string
      required:
      - company_name
      - public_id
    OrderListItem:
      type: object
      description: Output shape for one order card (schema only).
      properties:
        public_id:
          type: string
        created_at:
          type: string
          format: date-time
        status:
          type: string
          nullable: true
        client:
          $ref: '#/components/schemas/OrderListClient'
        delivery_address:
          type: string
        city:
          allOf:
          - $ref: '#/components/schemas/OrderListCity'
          nullable: true
