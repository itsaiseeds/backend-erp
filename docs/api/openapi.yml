        city:
          $ref: '#/components/schemas/PartyCityRef'
        contact_number:
          type: string
          nullable: true
      required:
      - city
      - contact_number
      - id
      - name
    PatchedEditFarmerVisitRequest:
      type: object
      description: |-
        A partial correction to a recorded farmer: send only what changed.

        Every field is optional, but one that is sent may not be blank: the name,
        contact number and village must have text and ``crop_ids`` at least one
        crop. ``product_public_ids`` may be empty -- the farmer does not use our
        products. Anything else sent is ignored.
      properties:
        farmer_name:
          type: string
          minLength: 1
          maxLength: 255
        contact_number:
          type: string
          minLength: 1
        village:
          type: string
          minLength: 1
          maxLength: 255
        land_area_bigha:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,4})?$
          description: Land held, in bigha.
        crop_ids:
          type: array
          items:
            type: integer
          minItems: 1
          description: Replaces the farmer's crops; at least one.
        product_public_ids:
          type: array
          items:
            type: string
            minLength: 1
          description: Replaces the products the farmer uses; empty if none.
    PatchedFieldTripWriteRequest:
      type: object
      description: |-
        A trip's plan: where and when. Every field is required on create; an
        edit validates it with ``partial=True`` and applies only what was sent.

        That the expected end falls after the expected start is checked on the
        merged trip by ``FieldTrip.clean()``, so a partial edit sending only one
        bound is still judged against the other.
      properties:
        city_id:
          type: integer
          description: A city id from utilities/cities.
        village:
          type: string
          minLength: 1
          maxLength: 255
        expected_start_at:
          type: string
          format: date-time
        expected_end_at:
          type: string
          format: date-time
    PatchedReturnOrderWriteRequest:
      type: object
      description: |-
        Request body to raise (Android POST) or edit (admin PATCH) a return.

        ``items`` is a full declarative replacement on edit: a line left out is
        removed. ``return_date`` defaults to today on create and is informational
        only. No field declares a ``default``, so an absent key stays absent.
      properties:
        return_date:
          type: string
          format: date
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReturnOrderItemWriteRequest'
    PatchedUpdateAdminRequest:
      type: object
      description: |-
        Request validation for updating an ``Admin`` (name/email/phone/stock flag).

        Callers pass the ``Admin`` being edited as ``instance=`` so the phone
        uniqueness check excludes that user's own row.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        phone_number:
          type: string
          minLength: 1
          maxLength: 10
        can_update_stock_count:
          type: boolean
        share_contact:
          type: boolean
    PatchedUpdateCropRequest:
      type: object
      description: Request validation for updating a ``Crop`` (name only).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
    PatchedUpdateCustomOrderRequest:
      type: object
      description: |-
        Request validation for an admin's custom-order update -- every field optional.

        No field may declare a ``default``: the view applies a field only when the
        key is present in ``validated_data``, and DRF injects a declared default
        even for an absent key, which would silently rewrite an untouched column.
      properties:
        client_address_id:
          type: integer
          description: A ClientAddress link id belonging to the custom order's client.
        expected_delivery_date:
          type: string
          format: date
        actual_delivery_date:
          type: string
          format: date
          nullable: true
        special_comments:
          type: string
          description: A remark to add to the custom order. Appended as a new line
            -- it never replaces what is already there.
        items:
          type: array
          items:
            $ref: '#/components/schemas/CustomOrderItemWriteRequest'
    PatchedUpdateGodownManagerRequest:
      type: object
      description: |-
        Request validation for updating a ``GodownManager`` (name/email/phone).

        Callers pass the ``GodownManager`` being edited as ``instance=`` so the
        phone uniqueness check excludes that user's own row.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        phone_number:
          type: string
          minLength: 1
          maxLength: 10
    PatchedUpdateInwardRawMaterialRequest:
      type: object
      description: |-
        Request validation for updating a raw-material lot (all fields optional).

        Only ``lab_sampling_date`` and ``status`` are accepted: flipping to
        ``In Use`` stamps the effective date with today, reverting to
        ``Lab Testing`` clears it, and ``product`` / ``party`` / ``quantity_kg``
        are immutable. Any unknown key is ignored.
      properties:
        lab_sampling_date:
          type: string
          format: date
          nullable: true
        status:
          $ref: '#/components/schemas/UpdateInwardRawMaterialStatusEnum'
    PatchedUpdateLooseStockRequest:
      type: object
      description: 'Request validation: a list of loose lines.'
      properties:
        counts:
          type: array
          items:
            $ref: '#/components/schemas/LooseCountLineRequest'
          description: Loose lines, one per (product, packet_weight) pair.
    PatchedUpdateOrderRequest:
      type: object
      description: |-
        Request validation for an admin's order update -- every field optional.

        No field may declare a ``default``: the view applies a field only when the
        key is present in ``validated_data``, and DRF injects a declared default
        even for an absent key, which would silently rewrite an untouched column.
      properties:
        client_address_id:
          type: integer
          description: A ClientAddress link id belonging to the order's client.
        client_transport_agency_id:
          type: integer
          nullable: true
          description: A ClientTransportAgency link id belonging to the order's client;
            send null for a private (own-vehicle) dispatch.
        expected_delivery_date:
          type: string
          format: date
        actual_delivery_date:
          type: string
          format: date
          nullable: true
        special_comments:
          type: string
          description: A remark to add to the order. Appended as a new line -- it
            never replaces what is already there.
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemWriteRequest'
    PatchedUpdateOtherMaterialTypeRequest:
      type: object
      description: Request validation for updating an ``OtherMaterialType`` (all fields
        optional).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        unit_type:
          $ref: '#/components/schemas/UnitTypeEnum'
    PatchedUpdatePartyRequest:
      type: object
      description: Request validation for updating a ``Party`` (all fields optional).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        city:
          type: integer
        contact_number:
          type: string
          nullable: true
          maxLength: 10
    PatchedUpdateProductPackagingRequest:
      type: object
      description: |-
        Request validation for updating a ``ProductPackaging``: its selling price only.

        A packaging's product, packet weight and packet count are fixed once it is
        created; a request carrying them is ignored. To change them, create a new
        packaging.
      properties:
        selling_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
    PatchedUpdateProductRequest:
      type: object
      description: |-
        Request validation for updating a ``Product`` (all fields optional).

        ``description_items`` is declarative, like the client lists on
        ``UpdateClientView``: omit it to leave the bullets untouched, send a list to
        replace them wholesale, send ``[]`` to clear them.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        crop:
          type: integer
        stage:
          type: integer
        selling_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Rate per kilogram; packet and bag prices derive from it and
            the weight sold.
        is_usable:
          type: boolean
          description: 'False freezes the product: nothing about it can be created
            or changed until it is switched back on (its history stays visible). The
            other fields stay editable while it is frozen.'
        image:
          type: string
          format: binary
        description_items:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 255
          description: Feature bullets, in display order. Sending the list replaces
            it wholesale; [] clears it.
          maxItems: 30
    PatchedUpdateRawMaterialWasteRequest:
      type: object
      description: |-
        Request validation for a partial edit of a raw-material waste row.

        Send only what changed. The product is fixed -- delete and re-record to move
        waste to another product -- and ``quantity_kg``, when sent, must be above
        zero. ``reason`` is free text and may be cleared.
      properties:
        quantity_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,3})?$
          description: Kilograms of raw material wasted.
        reason:
          type: string
          maxLength: 255
    PatchedUpdateSalesPersonRequest:
      type: object
      description: |-
        Request validation for updating a ``SalesPerson`` (name/email/phone/city).

        Callers pass the ``SalesPerson`` being edited as ``instance=`` so the
        phone uniqueness check excludes that user's own row.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        phone_number:
          type: string
          minLength: 1
          maxLength: 10
        city:
          type: integer
    PatchedUpdateTodaysInventoryRequest:
      type: object
      description: |-
        Request validation: a map of packaging ``public_id`` → today's bag count.

        Bags only -- loose packets are never accepted here; they are recorded at
        ``/api/sales-admin/update-sample-packet-stock``.
      properties:
        counts:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
          description: Map of product-packaging public_id to its sealed-bag count;
            loose packets are recorded at ``update-sample-packet-stock``, not here.
    ProductKg:
      type: object
      properties:
        product:
          $ref: '#/components/schemas/AnalyticsProductRef'
        total_kg:
          type: string
          description: Kilograms booked across every status.
        kg_by_status:
          $ref: '#/components/schemas/OrderStatusKg'
      required:
      - kg_by_status
      - product
      - total_kg
    ProductLooseStockPayload:
      type: object
      description: Output shape for a product's loose position, one line per packet
        weight.
      properties:
        public_id:
          type: string
        name:
          type: string
        snapshot_date:
          type: string
          format: date
        lines:
          type: array
          items:
            $ref: '#/components/schemas/ProductLooseWeightLine'
      required:
      - lines
      - name
      - public_id
      - snapshot_date
    ProductLooseWeightLine:
      type: object
      description: Output shape for one packet-weight line of a product's loose position.
      properties:
        packet_weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,3})?$
        on_hand:
          type: integer
        reserved:
          type: integer
        consumed:
          type: integer
        available:
          type: integer
      required:
      - available
      - consumed
      - on_hand
      - packet_weight
      - reserved
    ProductPackagingPayload:
      type: object
      description: Output shape for one packaging row.
      properties:
        public_id:
          type: string
        product:
          $ref: '#/components/schemas/PackagingProductRef'
        packet_weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,3})?$
        packets:
          type: integer
          minimum: 1
        total_weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,3})?$
        selling_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
