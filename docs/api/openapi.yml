openapi: 3.0.3
info:
  title: SaiSeeds ERP API
  version: 1.0.0
  description: Backend API for the SaiSeeds sales admin website and salesperson Android
    app. Auto-generated from the codebase.
paths:
  /android/api/v1/auth/login:
    post:
      operationId: android_api_v1_auth_login_create
      description: Validate a TOTP code, then issue a bearer token for that sales
        person.
      tags:
      - android
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Invalid phone number or TOTP code.
          description: ''
        '429':
          content:
            application/json:
              schema:
                description: Too many requests from this IP; retry later.
          description: ''
  /android/api/v1/auth/logout:
    post:
      operationId: android_api_v1_auth_logout_create
      description: |-
        Revoke the caller's bearer token.

        Logout must succeed for anyone the token authentication accepts, so this
        view relaxes the ``salesperson_required`` gate inherited from
        ``AndroidBaseView``. Otherwise a user whose ``SalesPerson`` profile has
        been soft-deleted (or has already been logged out server-side) would be
        unable to revoke their still-valid token, leaving it live for the rest of
        ``TOKEN_TTL_HOURS``.
      summary: Revoke the caller's bearer token
      tags:
      - android
      security:
      - bearerAuth: []
      responses:
        '204':
          content:
            application/json:
              schema:
                description: Token revoked.
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Missing or invalid token.
          description: ''
  /android/api/v1/auth/reauthenticate:
    get:
      operationId: android_api_v1_auth_reauthenticate_retrieve
      description: Confirm the caller's bearer token is still valid.
      summary: Check whether the caller's bearer token is still valid
      tags:
      - android
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AndroidReauthenticateResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Missing, expired, or revoked token.
          description: ''
  /android/api/v1/client/{public_id}:
    get:
      operationId: android_api_v1_client_retrieve
      description: Full detail of one of the caller's clients, by ``public_id``.
      summary: Get one of my clients in full (core + all addresses/contacts/agencies)
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
        description: The client's public id, e.g. C-E79QA0E2OIHF.
        required: true
      tags:
      - android
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientPayload'
          description: ''
  /android/api/v1/create-client:
    post:
      operationId: android_api_v1_create_client_create
      description: Create a client owned by the calling sales person.
      summary: Create a client
      tags:
      - android
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClientRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateClientRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateClientRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientPayload'
          description: ''
  /android/api/v1/create-multi-select-bag-order:
    post:
      operationId: android_api_v1_create_multi_select_bag_order
      description: Book an order of sealed bags for one of the caller's clients.
      summary: Book an order from multi-selected catalogue bags
      tags:
      - android
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMultiSelectBagOrderRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateMultiSelectBagOrderRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateMultiSelectBagOrderRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPayload'
          description: ''
  /android/api/v1/get-clients:
    get:
      operationId: android_api_v1_get_clients_list
      description: 'List the caller''s clients: filter by city / status / created
        window, sort.'
      summary: List my clients (filter by city / status / name / address / created,
        sortable)
      parameters:
      - in: query
        name: address
        schema:
          type: string
        description: Case-insensitive substring of the primary address (line 1/2,
          pincode or city). Single value; AND-ed with the other filters.
      - in: query
        name: city_id
        schema:
          type: string
        description: City id(s) of the client's primary address (see options). Comma-separated
          (any match); AND-ed with the other filters.
      - in: query
        name: company_name
        schema:
          type: string
        description: Case-insensitive substring of the company name. Single value;
          AND-ed with the other filters.
      - in: query
        name: created_gte
        schema:
          type: string
          format: date-time
        description: When the client was added (ISO 8601). Inclusive lower bound.
      - in: query
        name: created_lte
        schema:
          type: string
          format: date-time
        description: When the client was added (ISO 8601). Inclusive upper bound.
      - in: query
        name: page
        schema:
          type: integer
        description: 1-based page number.
      - in: query
        name: page_size
        schema:
          type: integer
        description: Rows per page (default 10, max 30).
      - in: query
        name: sort
        schema:
          type: string
        description: Comma-separated sort keys (created_at, company_name); prefix
          a key with '-' for descending. Defaults to the view's natural order.
      - in: query
        name: status
        schema:
          type: string
        description: Client verification status. Comma-separated (any match); AND-ed
          with the other filters.
      tags:
      - android
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientListPage'
          description: ''
  /android/api/v1/get-orders:
    get:
      operationId: android_api_v1_get_orders_list
      description: 'List the caller''s orders: filter by client / product / city /
        status, sort.'
      summary: List my orders (filter by client / product / city / status, sortable)
      parameters:
      - in: query
        name: city_id
        schema:
          type: string
        description: City id(s) the order is delivered to (see options). Comma-separated
          (any match); AND-ed with the other filters.
      - in: query
        name: client
        schema:
          type: string
        description: Client public id(s) the order was booked for (see options). Comma-separated
          (any match); AND-ed with the other filters.
      - in: query
        name: page
        schema:
          type: integer
        description: 1-based page number.
      - in: query
        name: page_size
        schema:
          type: integer
        description: Rows per page (default 10, max 30).
      - in: query
        name: product
        schema:
          type: string
        description: Product public id(s) the order contains (see options). Comma-separated
          (any match); AND-ed with the other filters.
      - in: query
        name: sort
        schema:
          type: string
        description: Comma-separated sort keys (created_at, price); prefix a key with
          '-' for descending. Defaults to the view's natural order.
      - in: query
        name: status
        schema:
          type: string
        description: Order lifecycle status. Comma-separated (any match); AND-ed with
          the other filters.
      tags:
      - android
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListPage'
          description: ''
  /android/api/v1/sales-person-catalogue:
    get:
      operationId: android_api_v1_sales_person_catalogue_list
      description: |-
        The bags a sales person can book: filter by crop / product / stage / name
        / price, sort by price / stage / name.
      summary: Browse the product catalogue (filter by crop / product / stage / name
        / price, sortable)
      parameters:
      - in: query
        name: crop
        schema:
          type: string
        description: Crop id(s) of the product (see options). Comma-separated (any
          match); AND-ed with the other filters.
      - in: query
        name: name
        schema:
          type: string
        description: Case-insensitive substring of the product name. Single value;
          AND-ed with the other filters.
      - in: query
        name: page
        schema:
          type: integer
        description: 1-based page number.
      - in: query
        name: page_size
        schema:
          type: integer
        description: Rows per page (default 10, max 30).
      - in: query
        name: price_gte
        schema:
          type: number
        description: Price of the whole bag (inclusive bounds). Inclusive lower bound.
      - in: query
        name: price_lte
        schema:
          type: number
        description: Price of the whole bag (inclusive bounds). Inclusive upper bound.
      - in: query
        name: product
        schema:
          type: string
        description: Product public id(s), e.g. P-E79QA0E2OIHF. Comma-separated (any
          match); AND-ed with the other filters.
      - in: query
        name: sort
        schema:
          type: string
        description: Comma-separated sort keys (price, stage, name); prefix a key
          with '-' for descending. Defaults to the view's natural order.
      - in: query
        name: stage
        schema:
          type: string
        description: Seed stage of the product. Comma-separated (any match); AND-ed
          with the other filters.
      tags:
      - android
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CataloguePage'
          description: ''
  /android/api/v1/update-client:
    post:
      operationId: android_api_v1_update_client_create
      description: Replace the three lists of a client the calling sales person created.
      summary: Update a client's addresses, contacts and transport agencies
      tags:
      - android
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClientRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UpdateClientRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateClientRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientPayload'
          description: ''
  /android/api/v1/utilities/cities:
    get:
      operationId: android_api_v1_utilities_cities_list
      description: List Indian states, each with its cities, grouped by state.
      summary: List Indian states grouped with their cities
      tags:
      - android
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AndroidState'
          description: ''
  /android/api/v1/utilities/client-addresses:
    get:
      operationId: android_api_v1_utilities_client_addresses
      description: List one of the caller's clients' address links.
      summary: List a client's address links (delivery address picker)
      parameters:
      - in: query
        name: client_public_id
        schema:
          type: string
        description: Public id of one of your clients, e.g. C-E79QA0E2OIHF.
        required: true
      tags:
      - android
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientAddressLink'
          description: ''
  /android/api/v1/utilities/client-transport-agencies:
    get:
      operationId: android_api_v1_utilities_client_transport_agencies
      description: List one of the caller's clients' transport-agency links.
      summary: List a client's transport agency links (carrier picker)
      parameters:
      - in: query
        name: client_public_id
        schema:
          type: string
        description: Public id of one of your clients, e.g. C-E79QA0E2OIHF.
        required: true
      tags:
      - android
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientTransportAgencyLink'
          description: ''
  /android/api/v1/utilities/countries:
    get:
      operationId: android_api_v1_utilities_countries_list
      description: List the countries available for a client address.
      summary: List countries
      tags:
      - android
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AndroidCountry'
          description: ''
  /android/api/v1/utilities/states:
    get:
      operationId: android_api_v1_utilities_states_list
      description: List the states available for a client address, optionally by country.
      summary: List states (optionally scoped to a country)
      parameters:
      - in: query
        name: country_id
        schema:
          type: integer
        description: Only return states in this country.
      tags:
      - android
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AndroidStateRef'
          description: ''
  /api/execute-code/:
    post:
      operationId: execute_code
      description: Execute Python on the server (``execute_python_code`` permission
        only).
      summary: Execute Python code on the server (permission-gated)
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteCodeRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExecuteCodeRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExecuteCodeRequestRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecuteCodeResponse'
          description: ''
  /api/sales-admin/admins:
    get:
      operationId: api_sales_admin_admins_list
      description: List (GET) or create (POST) application admins (superuser only).
      summary: List application admins
      tags:
      - api
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminPayload'
          description: ''
    post:
      operationId: api_sales_admin_admins_create
      description: List (GET) or create (POST) application admins (superuser only).
      summary: Create an application admin (and a fallback sales person)
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdminRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateAdminRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateAdminRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPayload'
          description: ''
  /api/sales-admin/admins/{id}:
    patch:
      operationId: api_sales_admin_admins_partial_update
      description: Update or delete a single application admin (superuser only).
      summary: Update an application admin
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateAdminRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateAdminRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateAdminRequest'
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPayload'
          description: ''
    delete:
      operationId: api_sales_admin_admins_destroy
      description: Update or delete a single application admin (superuser only).
      summary: Delete an application admin
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - sessionAuth: []
      responses:
        '204':
          description: No response body
  /api/sales-admin/auth/logout:
    post:
      operationId: api_sales_admin_auth_logout_create
      description: Revoke the caller's session cookie.
      summary: Revoke the caller's session
      tags:
      - api
      security:
      - sessionAuth: []
      responses:
        '204':
          content:
            application/json:
              schema:
                description: Session revoked.
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Missing or invalid session.
          description: ''
  /api/sales-admin/auth/otp/verify:
    post:
      operationId: api_sales_admin_auth_otp_verify_create
      description: Validate a TOTP code, then (re)open a session for that user.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyOTPResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Invalid phone number or TOTP code.
          description: ''
        '429':
          content:
            application/json:
              schema:
                description: Too many requests from this IP; retry later.
          description: ''
  /api/sales-admin/bag-stock:
    get:
      operationId: api_sales_admin_bag_stock_retrieve
      description: Read the current bag-stock position for every counted packaging.
      summary: Read the bag-stock position
      tags:
      - api
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BagStockPosition'
          description: ''
  /api/sales-admin/check-todays-inventory:
    get:
      operationId: api_sales_admin_check_todays_inventory_retrieve
      description: '``is_complete`` covers sealed bags only -- the loose count is
        optional and never blocks order verification.'
      summary: Check whether today's stock count is complete
      tags:
      - api
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckTodaysInventoryPayload'
          description: ''
  /api/sales-admin/client/{public_id}:
    get:
      operationId: api_sales_admin_client_retrieve
      description: Full detail of one client, by ``public_id`` (app admin only).
      summary: Get a client in full (core + all addresses/contacts/agencies)
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
        description: The client's public id, e.g. C-E79QA0E2OIHF.
        required: true
      tags:
      - api
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientPayload'
          description: ''
  /api/sales-admin/crops:
    get:
      operationId: api_sales_admin_crops_list
      description: List (GET) or create (POST) crops (app admin only).
      summary: List crops
      tags:
      - api
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CropPayload'
          description: ''
    post:
      operationId: api_sales_admin_crops_create
      description: List (GET) or create (POST) crops (app admin only).
      summary: Create a crop
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCropRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateCropRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateCropRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CropPayload'
          description: ''
  /api/sales-admin/crops/{id}:
    patch:
      operationId: api_sales_admin_crops_partial_update
      description: Update or delete a single crop (app admin only).
      summary: Update a crop
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateCropRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateCropRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateCropRequest'
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CropPayload'
          description: ''
    delete:
      operationId: api_sales_admin_crops_destroy
      description: Update or delete a single crop (app admin only).
      summary: Delete a crop
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - sessionAuth: []
      responses:
        '204':
          description: No response body
  /api/sales-admin/dispatch-challans/:
    get:
      operationId: sales_admin_get_dispatch_challans
      description: List the delivery challans of dispatched orders whose LR is recorded.
      summary: List dispatch challans (filter by client / destination city, sortable)
      parameters:
      - in: query
        name: city_id
        schema:
          type: string
        description: City id(s) the goods were sent to (see options). Comma-separated
          (any match); AND-ed with the other filters.
      - in: query
        name: client
        schema:
          type: string
        description: Client id(s) the goods were consigned to (see options). Comma-separated
          (any match); AND-ed with the other filters.
      - in: query
        name: end_date_time
        schema:
          type: string
          format: date-time
        description: ISO 8601. End date time of the window.
        required: true
      - in: query
        name: page
        schema:
          type: integer
        description: 1-based page number.
      - in: query
        name: page_size
        schema:
          type: integer
        description: Rows per page (default 10, max 30).
      - in: query
        name: sort
        schema:
          type: string
        description: Comma-separated sort keys (dispatch_date, created_at); prefix
          a key with '-' for descending. Defaults to the view's natural order.
      - in: query
        name: start_date_time
        schema:
          type: string
          format: date-time
        description: ISO 8601. Start date time of the window.
        required: true
      tags:
      - api
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchChallanPage'
