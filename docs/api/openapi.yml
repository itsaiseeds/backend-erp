    CreateAdminRequest:
      type: object
      description: |-
        Request validation for creating a new application ``Admin``.

        ``city`` is required because creating an admin also creates the fallback
        ``SalesPerson`` profile, which needs a city.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        phone_number:
          type: string
          minLength: 1
          maxLength: 10
        can_update_stock_count:
          type: boolean
          default: false
        share_contact:
          type: boolean
          default: false
        city:
          type: integer
          description: City for the fallback salesperson profile created with this
            admin.
      required:
      - city
      - name
      - phone_number
    CreateClientRequest:
      type: object
      description: Request validation for creating a client with its three lists.
      properties:
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/ClientAddressRequest'
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/ClientContactRequest'
        transport_agencies:
          type: array
          items:
            $ref: '#/components/schemas/ClientTransportAgencyRequest'
        company_name:
          type: string
          minLength: 1
          maxLength: 255
        company_phone:
          type: string
          default: ''
          maxLength: 10
        gst_number:
          type: string
          minLength: 1
          maxLength: 15
      required:
      - addresses
      - company_name
      - contacts
      - gst_number
      - transport_agencies
    CreateCropRequest:
      type: object
      description: Request validation for creating a new ``Crop``.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
      required:
      - name
    CreateCustomOrderRequest:
      type: object
      description: Request validation for booking a custom order.
      properties:
        client_public_id:
          type: string
          minLength: 1
          maxLength: 20
        client_address_id:
          type: integer
          description: A ClientAddress link id belonging to the client.
        special_comments:
          type: string
          default: ''
        expected_delivery_date:
          type: string
          format: date
          nullable: true
          description: Defaults to the day after booking.
        items:
          type: array
          items:
            $ref: '#/components/schemas/CustomOrderItemWriteRequest'
      required:
      - client_address_id
      - client_public_id
      - items
    CreateFarmerVisitRequest:
      type: object
      description: |-
        A farmer met on an in-progress trip.

        ``crop_ids`` come from ``utilities/crops`` and ``product_public_ids`` from
        ``utilities/products``. An empty (or omitted) product list records that the
        farmer does not use our products.
      properties:
        field_trip_public_id:
          type: string
          minLength: 1
          maxLength: 20
        farmer_name:
          type: string
          minLength: 1
          maxLength: 255
        contact_number:
          type: string
          minLength: 1
        village:
          type: string
          default: ''
          description: Defaults to the field trip's village.
          maxLength: 255
        land_area_bigha:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,4})?$
          description: Land held, in bigha.
        crop_ids:
          type: array
          items:
            type: integer
          description: At least one crop the farmer grows.
        product_public_ids:
          type: array
          items:
            type: string
            minLength: 1
          description: Our products the farmer uses; empty if none.
      required:
      - contact_number
      - crop_ids
      - farmer_name
      - field_trip_public_id
      - land_area_bigha
    CreateGodownManagerRequest:
      type: object
      description: Request validation for creating a new ``GodownManager``.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        phone_number:
          type: string
          minLength: 1
          maxLength: 10
      required:
      - name
      - phone_number
    CreateInwardOtherMaterialRequest:
      type: object
      description: |-
        Request validation for booking a new other-material lot.

        ``effective_date`` is absent on purpose: booking stamps it with today
        (see ``InwardOtherMaterialsView.post``).
      properties:
        party:
          type: integer
        recipe:
          type: string
          minLength: 1
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,3})?$
          description: Amount received, in the recipe's material unit.
      required:
      - party
      - quantity
      - recipe
    CreateInwardRawMaterialRequest:
      type: object
      description: |-
        Request validation for booking a new raw-material lot.

        ``status`` is not accepted: every lot starts ``Lab Testing`` and is moved to
        ``In Use`` or ``Rejected`` later with ``PATCH``. ``effective_date`` is
        stamped (today) at that flip and is deliberately absent here.
        ``lab_sampling_date`` may be given explicitly; left out, it defaults to
        today -- a lot never starts with no sampling date, since it arrives for
        lab testing the day it's booked. ``lot_no`` -- the supplier's own batch
        number on the consignment -- is required.
      properties:
        product:
          type: string
          minLength: 1
        party:
          type: integer
        lot_no:
          type: string
          minLength: 1
          description: The supplier's own batch number for this consignment.
          maxLength: 64
        quantity_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,3})?$
          description: Kilograms received from the party.
        lab_sampling_date:
          type: string
          format: date
          nullable: true
      required:
      - lot_no
      - party
      - product
      - quantity_kg
    CreateMultiSelectBagOrderRequest:
      type: object
      description: |-
        Request validation for booking a bag order.

        The address and the agency arrive as *link* ids, so each resolves with a
        single lookup scoped to the client -- an id belonging to somebody else
        simply does not match, and the "belongs to this client" rule
        ``Order.clean()`` enforces is satisfied by construction.
      properties:
        client_public_id:
          type: string
          minLength: 1
          maxLength: 20
        client_address_id:
          type: integer
          description: A link id from GET /android/api/v1/utilities/client-addresses.
        client_transport_agency_id:
          type: integer
          nullable: true
          description: A link id from GET /android/api/v1/utilities/client-transport-agencies.
            Omit or send null for a private (own-vehicle) dispatch.
        special_comments:
          type: string
          default: ''
        expected_delivery_date:
          type: string
          format: date
          nullable: true
          description: Defaults to the day after booking.
        items:
          type: array
          items:
            $ref: '#/components/schemas/BagOrderItemRequest'
      required:
      - client_address_id
      - client_public_id
      - items
    CreateOtherMaterialTypeRequest:
      type: object
      description: Request validation for creating a new ``OtherMaterialType``.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        unit_type:
          $ref: '#/components/schemas/UnitTypeEnum'
      required:
      - name
      - unit_type
    CreatePartyRequest:
      type: object
      description: Request validation for creating a new ``Party``.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        city:
          type: integer
        contact_number:
          type: string
          nullable: true
          maxLength: 10
      required:
      - city
      - name
    CreateProductPackagingRequest:
      type: object
      description: |-
        Request validation for creating a new ``ProductPackaging``.

        ``product`` is addressed by its ``public_id`` (``P-…``). ``selling_price``
        is the whole-packaging price; when omitted it is frozen to
        ``packets * product.price_for_weight(packet_weight)`` -- the product's
        per-kilogram rate applied to one packet, times the packets in the bag (see
        ``aggregator.ProductOperations.add_packaging``).
      properties:
        product:
          type: string
          minLength: 1
        packet_weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,3})?$
        packets:
          type: integer
          minimum: 1
        selling_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
      - packet_weight
      - packets
      - product
    CreateProductRequest:
      type: object
      description: Request validation for creating a new ``Product``.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        crop:
          type: integer
        stage:
          type: integer
        selling_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Rate per kilogram; packet and bag prices derive from it and
            the weight sold.
        image:
          type: string
          format: binary
        description_items:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 255
          description: Feature bullets, in display order. Sending the list replaces
            it wholesale; [] clears it.
          maxItems: 30
      required:
      - crop
      - name
      - selling_price
      - stage
    CreateRawMaterialWasteRequest:
      type: object
      description: |-
        Request validation for recording raw-material waste.

        There is no date field: waste is a standing deduction from the product's
        unpacked raw pool from the moment it is recorded.
      properties:
        product:
          type: string
          minLength: 1
        quantity_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,3})?$
          description: Kilograms of raw material wasted.
        reason:
          type: string
          default: ''
          maxLength: 255
      required:
      - product
      - quantity_kg
    CreateRecipeRequest:
      type: object
      description: Request validation for creating a new ``OtherMaterialRecipe``.
      properties:
        product:
          type: string
          minLength: 1
        material_type:
          type: integer
        packet_weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,3})?$
          description: Weight of the covered packet, in kilograms (the product variant).
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,3})?$
          description: Multiples of the material per pack, in the material type's
            unit (2 leaflets, 2.000 kg cover, 5 litre).
      required:
      - material_type
      - packet_weight
      - product
      - quantity
    CreateSalesPersonRequest:
      type: object
      description: Request validation for creating a new ``SalesPerson`` (city only).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        phone_number:
          type: string
          minLength: 1
          maxLength: 10
        city:
          type: integer
      required:
      - city
      - name
      - phone_number
    CropPayload:
