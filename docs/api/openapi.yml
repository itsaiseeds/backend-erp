          type: string
      required:
      - name
      - public_id
    OrderCardPackaging:
      type: object
      description: |-
        Output shape for one bag on an order card, and how many of it.

        One entry per order line. The bag is the unit an order is placed in, so two
        sizes of the same seed are two entries rather than one product listed twice.
      properties:
        public_id:
          type: string
        product:
          $ref: '#/components/schemas/OrderCardProduct'
        packet_weight:
          type: string
        packets:
          type: integer
        total_weight:
          type: string
        selling_price:
          type: string
          description: The bag's own list price, not what this order was charged.
        negotiated_selling_price:
          type: string
          description: The per-bag rate this order was actually charged for the line.
        quantity:
          type: integer
          description: Bags of this kind on the order.
      required:
      - negotiated_selling_price
      - packet_weight
      - packets
      - product
      - public_id
      - quantity
      - selling_price
      - total_weight
    OrderCardProduct:
      type: object
      description: |-
        Output shape for the product a bag on an order *card* holds.

        Wider than ``packaging_payload``'s own ``product`` block by exactly one
        field: the picture the card renders. ``packaging_payload`` is left alone
        because it is embedded in every order payload and across the sales-admin
        API, where the image does not belong.
      properties:
        public_id:
          type: string
        name:
          type: string
        image_url:
          type: string
          description: 'The product''s picture: an absolute URL when deployed, a MEDIA_URL-relative
            path in development, empty when none is set.'
      required:
      - image_url
      - name
      - public_id
    OrderDetailPayload:
      type: object
      description: |-
        Output shape for one order in full (``order_detail_payload``).

        Identical to the Android booking response except that ``client`` carries the
        whole client -- every address and transport agency, each with its link id --
        rather than just the company name and GST number.
      properties:
        public_id:
          type: string
        client:
          $ref: '#/components/schemas/ClientPayload'
        delivery_address:
          type: string
        status:
          type: string
          nullable: true
        expected_delivery_date:
          type: string
          format: date
        actual_delivery_date:
          type: string
          format: date
          nullable: true
        special_comments:
          type: string
        transport_agency:
          allOf:
          - $ref: '#/components/schemas/TransportAgencyRef'
          nullable: true
        dispatch_mode:
          $ref: '#/components/schemas/DispatchModeEnum'
        verified_at:
          type: string
          format: date-time
          nullable: true
        total_amount:
          type: string
        total_packets:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemPayload'
      required:
      - actual_delivery_date
      - client
      - delivery_address
      - dispatch_mode
      - expected_delivery_date
      - items
      - public_id
      - special_comments
      - status
      - total_amount
      - total_packets
      - transport_agency
      - verified_at
    OrderItemPayload:
      type: object
      description: Output shape for one order line (schema only).
      properties:
        packaging:
          $ref: '#/components/schemas/PackagingPayload'
        negotiated_selling_price:
          type: string
        quantity:
          type: integer
        line_total:
          type: string
      required:
      - line_total
      - negotiated_selling_price
      - packaging
      - quantity
    OrderItemWriteRequest:
      type: object
      description: 'One desired line of the order: a bag, how many, and optionally
        at what price.'
      properties:
        product_packaging_public_id:
          type: string
          minLength: 1
          maxLength: 20
        quantity:
          type: integer
          minimum: 1
        negotiated_selling_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Whole-bag rate for this line. Omit it to leave an existing
            line's price alone, or to charge a new line the bag's list price.
      required:
      - product_packaging_public_id
      - quantity
    OrderListCity:
      type: object
      description: Output shape for the ``city`` reference on an order card.
