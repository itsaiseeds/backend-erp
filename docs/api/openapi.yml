    CreateInwardOtherMaterialRequest:
      type: object
      description: |-
        Request validation for booking a new other-material lot.

        ``effective_date`` is absent on purpose: booking stamps it with today
        (see ``InwardOtherMaterialsView.post``).
      properties:
        party:
          type: integer
        recipe:
          type: integer
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,3})?$
          description: Amount received, in the recipe's material unit.
      required:
      - party
      - quantity
      - recipe
    CreateInwardRawMaterialRequest:
      type: object
      description: |-
        Request validation for booking a new raw-material lot.

        ``status`` is not accepted: every lot starts ``lab_testing`` and is moved to
        ``in_use`` later with ``PATCH``. ``effective_date`` is stamped (today) at
        that flip and is deliberately absent here.
      properties:
        product:
          type: integer
        party:
          type: integer
        quantity_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,3})?$
          description: Kilograms received from the party.
        lab_sampling_date:
          type: string
          format: date
          nullable: true
      required:
      - party
      - product
      - quantity_kg
    CreateMultiSelectBagOrderRequest:
      type: object
      description: |-
        Request validation for booking a bag order.

        The address and the agency arrive as *link* ids, so each resolves with a
        single lookup scoped to the client -- an id belonging to somebody else
        simply does not match, and the "belongs to this client" rule
        ``Order.clean()`` enforces is satisfied by construction.
      properties:
        client_public_id:
          type: string
          minLength: 1
          maxLength: 20
        client_address_id:
          type: integer
          description: A link id from GET /android/api/v1/utilities/client-addresses.
        client_transport_agency_id:
          type: integer
          nullable: true
          description: A link id from GET /android/api/v1/utilities/client-transport-agencies.
            Omit or send null for a private (own-vehicle) dispatch.
        special_comments:
          type: string
          default: ''
        expected_delivery_date:
          type: string
          format: date
          nullable: true
          description: Defaults to the day after booking.
        items:
          type: array
          items:
            $ref: '#/components/schemas/BagOrderItemRequest'
      required:
      - client_address_id
      - client_public_id
      - items
    CreateOtherMaterialTypeRequest:
      type: object
      description: Request validation for creating a new ``OtherMaterialType``.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        unit_type:
          $ref: '#/components/schemas/UnitTypeEnum'
      required:
      - name
      - unit_type
    CreatePartyRequest:
      type: object
      description: Request validation for creating a new ``Party``.
      properties:
        name:
