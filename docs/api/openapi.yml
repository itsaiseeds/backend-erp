    ClientAddressRequest:
      type: object
      description: |-
        One address of a client.

        City, state and country are master data and must already exist; the pincode
        is typed in by the sales person and is created on demand.
        ``Address.clean()`` then checks the whole pincode -> city -> state ->
        country chain hangs together.
      properties:
        line_1:
          type: string
          minLength: 1
          maxLength: 255
        line_2:
          type: string
          default: ''
          maxLength: 255
        pincode:
          type: string
          minLength: 1
          maxLength: 10
        city:
          type: integer
        state:
          type: integer
        country:
          type: integer
        label:
          type: string
          default: ''
          maxLength: 64
        is_primary:
          type: boolean
          default: false
      required:
      - city
      - country
      - line_1
      - pincode
      - state
    ClientContactPayload:
      type: object
      description: Output shape for one client contact (schema only).
      properties:
        name:
          type: string
        phone_number:
          type: string
        role:
          type: string
        is_primary:
          type: boolean
      required:
      - is_primary
      - name
      - phone_number
      - role
    ClientContactRequest:
      type: object
      description: One contact person of a client.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        phone_number:
          type: string
          minLength: 1
          maxLength: 10
        role:
