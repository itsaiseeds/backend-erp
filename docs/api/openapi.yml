          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/ClientListItem'
        available_filters:
          type: array
          items:
            $ref: '#/components/schemas/FilterCatalogueEntry'
        available_sorts:
          type: array
          items:
            $ref: '#/components/schemas/SortCatalogueEntry'
