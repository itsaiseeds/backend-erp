                  counts:
                  - product: P-A1B2C3D4E0F1
                    packet_weight: '1.000'
                    packets: 12
                  - product: P-A1B2C3D4E0F1
                    packet_weight: '0.500'
                    packets: 0
                summary: Whole-day loose count
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UpdateLooseStockRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateLooseStockRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LooseStockPayload'
          description: ''
    patch:
      operationId: api_sales_admin_update_sample_packet_stock_partial_update
      description: Only the pairs named in ``counts`` are written; every other loose
        row is left as it is.
      summary: Partially update the loose-stock count
      tags:
      - Admin · Stock count
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateLooseStockRequest'
            examples:
              PartialLooseCount:
                value:
                  counts:
                  - product: P-A1B2C3D4E0F1
                    packet_weight: '1.000'
                    packets: 12
                summary: Partial loose count
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateLooseStockRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateLooseStockRequest'
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LooseStockPayload'
          description: ''
