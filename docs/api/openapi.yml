        id:
          type: integer
          description: Send this in crop_ids.
        name:
          type: string
        is_deleted:
          type: boolean
      required:
      - id
      - is_deleted
      - name
    UtilityOtherMaterialType:
      type: object
      description: Output shape for one material type row (schema only).
      properties:
        id:
          type: integer
        name:
          type: string
        unit_type:
          type: string
          description: Count / kg / litre.
      required:
      - id
      - name
      - unit_type
    UtilityParty:
      type: object
      description: Output shape for one party row (schema only).
      properties:
        id:
          type: integer
          description: Send this as party.
        name:
          type: string
        city:
          $ref: '#/components/schemas/UtilityPartyCityRef'
        contact_number:
          type: string
          nullable: true
      required:
      - city
      - contact_number
      - id
      - name
    UtilityPartyCityRef:
      type: object
      description: Output shape for the ``city`` reference on a party (schema only).
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    UtilityProduct:
      type: object
      description: Output shape for one product row (schema only).
      properties:
        public_id:
          type: string
          description: Send this in product_public_ids.
        name:
          type: string
        crop_id:
          type: integer
        crop:
          type: string
        image_url:
          type: string
        is_deleted:
          type: boolean
        is_usable:
          type: boolean
          description: 'False when the product is frozen (no stock or booking action
            is available for it). It is still listed here: farmers and field trips
            keep seeing it.'
      required:
      - crop
      - crop_id
      - image_url
      - is_deleted
      - is_usable
      - name
      - public_id
    VerifyClientRequest:
      type: object
      description: Request validation for verifying a client.
      properties:
        public_id:
          type: string
          minLength: 1
          maxLength: 20
      required:
      - public_id
    VerifyOTPRequest:
      type: object
      properties:
        phone_number:
          type: string
          minLength: 1
          maxLength: 10
        otp:
          type: string
          minLength: 1
          maxLength: 8
      required:
      - otp
      - phone_number
    VerifyOTPResponse:
      type: object
      description: |-
        User payload returned after a successful TOTP exchange.

        The session cookie itself is set via ``Set-Cookie`` (see ``login()``
        below), not returned in the body.
      properties:
        user:
          $ref: '#/components/schemas/VerifyOTPUser'
        can_create_admin:
          type: boolean
        can_create_sales_person:
          type: boolean
        can_create_godown_manager:
          type: boolean
      required:
      - can_create_admin
      - can_create_godown_manager
      - can_create_sales_person
      - user
    VerifyOTPUser:
      type: object
      description: The authenticated user, as returned by the login flow.
      properties:
        id:
          type: integer
        name:
          type: string
        phone_number:
          type: string
        role:
          type: string
      required:
      - id
      - name
      - phone_number
      - role
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token
      description: Expiring bearer token used by the Android app.
    sessionAuth:
      type: apiKey
      in: header
      name: sessionid
      description: Django session cookie for the sales admin website.
