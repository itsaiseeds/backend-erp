  /api/sales-admin/update-bag-stock:
    post:
      operationId: api_sales_admin_update_bag_stock_create
      description: 'Sealed-bag counts only: every active packaging receives a snapshot
        row for today, and packagings absent from ``counts`` are recorded as zero
        bags. Loose packets are not accepted here -- record them at ``/api/sales-admin/update-sample-packet-stock``.'
      summary: Replace today's entire stock count
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTodaysInventoryRequest'
            examples:
              Whole-dayBagCount:
                value:
                  counts:
                    PP-A1B2C3D4E0F1: 12
                    PP-A1B2C3D4E0F2: 0
                summary: Whole-day bag count
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UpdateTodaysInventoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateTodaysInventoryRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SnapshotPayload'
          description: ''
    patch:
      operationId: api_sales_admin_update_bag_stock_partial_update
      description: 'Sealed-bag counts only: only the packagings named in ``counts``
        are written; the rest of today''s rows are left as they are. Loose packets
        are not accepted here -- record them at ``/api/sales-admin/update-sample-packet-stock``.'
      summary: Partially update today's stock count
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateTodaysInventoryRequest'
            examples:
              PartialBagCount:
                value:
                  counts:
                    PP-A1B2C3D4E0F1: 12
                summary: Partial bag count
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateTodaysInventoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateTodaysInventoryRequest'
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SnapshotPayload'
          description: ''
