openapi: 3.0.3
info:
  title: SaiSeeds ERP API
  version: 1.0.0
  description: Backend API for the SaiSeeds sales admin website and salesperson Android
    app. Auto-generated from the codebase.
paths:
  /api/sales_admin/auth/otp/verify:
    post:
      operationId: sales_admin_auth_otp_verify_create
      description: Validate a TOTP code, then (re)issue credentials for that user.
      tags:
      - sales_admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyOTP'
          description: ''
  /api/sales_admin/auth/totp/enroll:
    post:
      operationId: sales_admin_auth_totp_enroll_create
      description: Generate and activate a TOTP secret for a user.
      tags:
      - sales_admin
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/sales_admin/auth/totp/verify-enroll:
    post:
      operationId: sales_admin_auth_totp_verify_enroll_create
      description: Verify a code to activate the generated TOTP secret for a user.
      tags:
      - sales_admin
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
components:
  schemas:
    VerifyOTP:
      type: object
      properties:
        phone_number:
          type: string
          maxLength: 10
        otp:
          type: string
          maxLength: 8
      required:
      - otp
      - phone_number
    VerifyOTPRequest:
      type: object
      properties:
        phone_number:
          type: string
          minLength: 1
          maxLength: 10
        otp:
          type: string
          minLength: 1
          maxLength: 8
      required:
      - otp
      - phone_number
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
