components:
  schemas:
    AdminPayload:
      type: object
      description: Swagger schema for one admin row (no city, address or audit keys).
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          nullable: true
        phone_number:
          type: string
        role:
          type: string
        created_by:
          allOf:
          - $ref: '#/components/schemas/UserRef'
          nullable: true
        created_at:
          type: string
          format: date-time
        can_update_stock_count:
          type: boolean
        totp:
          $ref: '#/components/schemas/Totp'
      required:
      - can_update_stock_count
      - created_at
      - id
      - name
      - phone_number
      - role
    AdminUpdateClientRequest:
      type: object
      description: Request validation for an admin's client update -- every field
        optional.
      properties:
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/ClientAddressRequest'
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/ClientContactRequest'
        transport_agencies:
          type: array
          items:
            $ref: '#/components/schemas/ClientTransportAgencyRequest'
        public_id:
          type: string
          minLength: 1
          maxLength: 20
        company_name:
          type: string
          minLength: 1
          maxLength: 255
        company_phone:
          type: string
          maxLength: 10
        gst_number:
          type: string
          minLength: 1
          maxLength: 15
      required:
      - public_id
    AndroidCity:
      type: object
      description: Output shape for one city row (schema only; responses are built
        by hand).
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    AndroidReauthenticateResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/AndroidReauthenticateUser'
      required:
      - user
    AndroidReauthenticateUser:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        phone_number:
          type: string
        role:
          type: string
      required:
      - id
      - name
      - phone_number
      - role
    AndroidState:
      type: object
      description: Output shape for a state and its cities (schema only).
      properties:
        id:
          type: integer
        name:
          type: string
        cities:
          type: array
          items:
            $ref: '#/components/schemas/AndroidCity'
      required:
      - cities
      - id
      - name
    City:
      type: object
      description: Output shape for one city row (schema only; responses are built
        by hand).
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    CityRef:
      type: object
      description: Swagger schema for a compact ``{id, name}`` city reference.
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    ClientAddressPayload:
      type: object
      description: Output shape for one client address (schema only).
      properties:
        label:
          type: string
        is_primary:
          type: boolean
        line_1:
          type: string
        line_2:
          type: string
        pincode:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
      required:
      - city
      - country
      - is_primary
      - label
      - line_1
      - line_2
      - pincode
      - state
    ClientAddressRequest:
      type: object
      description: |-
        One address of a client.

        City, state and country are master data and must already exist; the pincode
        is typed in by the sales person and is created on demand.
        ``Address.clean()`` then checks the whole pincode -> city -> state ->
        country chain hangs together.
      properties:
        line_1:
          type: string
          minLength: 1
          maxLength: 255
        line_2:
          type: string
          default: ''
          maxLength: 255
        pincode:
          type: string
          minLength: 1
          maxLength: 10
        city:
          type: integer
        state:
          type: integer
        country:
          type: integer
        label:
          type: string
          default: ''
          maxLength: 64
        is_primary:
          type: boolean
          default: false
      required:
      - city
      - country
      - line_1
      - pincode
      - state
    ClientCityGroup:
      type: object
      description: Output shape for one city block (schema only).
      properties:
        city:
          allOf:
          - $ref: '#/components/schemas/ClientCityRef'
          nullable: true
        clients:
          type: array
          items:
            $ref: '#/components/schemas/ClientListItem'
      required:
      - city
      - clients
    ClientCityRef:
      type: object
      description: Output shape for the city a group is keyed by (schema only).
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    ClientContactPayload:
      type: object
      description: Output shape for one client contact (schema only).
      properties:
        name:
          type: string
        phone_number:
          type: string
        role:
          type: string
        is_primary:
          type: boolean
      required:
      - is_primary
      - name
      - phone_number
      - role
    ClientContactRequest:
      type: object
      description: One contact person of a client.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        phone_number:
          type: string
          minLength: 1
          maxLength: 10
        role:
          type: string
          default: ''
          maxLength: 64
        is_primary:
          type: boolean
          default: false
      required:
      - name
      - phone_number
    ClientListItem:
      type: object
      description: Output shape for one client card (schema only).
      properties:
        public_id:
          type: string
        company_name:
          type: string
        company_phone:
          type: string
        status:
          type: string
        primary_contact:
          allOf:
          - $ref: '#/components/schemas/ClientContactPayload'
          nullable: true
        primary_address:
          allOf:
          - $ref: '#/components/schemas/ClientAddressPayload'
          nullable: true
      required:
      - company_name
      - company_phone
      - primary_address
      - primary_contact
      - public_id
      - status
    ClientPayload:
      type: object
      description: Output shape for a full client (schema only; responses are built
        by hand).
      properties:
        public_id:
          type: string
        company_name:
          type: string
        company_phone:
          type: string
        gst_number:
          type: string
        status:
          type: string
        is_verified:
          type: boolean
        verified_at:
          type: string
          format: date-time
          nullable: true
        verified_by:
          type: string
          nullable: true
        created_by:
          type: string
          nullable: true
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/ClientAddressPayload'
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/ClientContactPayload'
        transport_agencies:
          type: array
          items:
            $ref: '#/components/schemas/ClientTransportAgencyPayload'
      required:
      - addresses
      - company_name
      - company_phone
      - contacts
      - created_by
      - gst_number
      - is_verified
      - public_id
      - status
      - transport_agencies
      - verified_at
      - verified_by
    ClientTransportAgencyPayload:
      type: object
      description: Output shape for one client transport agency (schema only).
      properties:
        name:
          type: string
        is_primary:
          type: boolean
      required:
      - is_primary
      - name
    ClientTransportAgencyRequest:
      type: object
      description: One transport agency of a client -- a name and nothing else.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        is_primary:
          type: boolean
          default: false
      required:
      - name
    CreateAdminRequest:
      type: object
      description: |-
        Request validation for creating a new application ``Admin``.

        ``city`` is required because creating an admin also creates the fallback
        ``SalesPerson`` profile, which needs a city.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        phone_number:
          type: string
          minLength: 1
          maxLength: 10
        can_update_stock_count:
          type: boolean
          default: false
        city:
          type: integer
          description: City for the fallback salesperson profile created with this
            admin.
      required:
      - city
      - name
      - phone_number
    CreateClientRequest:
      type: object
      description: Request validation for creating a client with its three lists.
      properties:
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/ClientAddressRequest'
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/ClientContactRequest'
        transport_agencies:
          type: array
          items:
            $ref: '#/components/schemas/ClientTransportAgencyRequest'
        company_name:
          type: string
          minLength: 1
          maxLength: 255
        company_phone:
          type: string
          default: ''
          maxLength: 10
        gst_number:
          type: string
          minLength: 1
          maxLength: 15
      required:
      - addresses
      - company_name
      - contacts
      - gst_number
      - transport_agencies
    CreateCropRequest:
      type: object
      description: Request validation for creating a new ``Crop``.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
      required:
      - name
    CreateProductPackagingRequest:
      type: object
      description: |-
        Request validation for creating a new ``ProductPackaging``.

        ``product`` is addressed by its ``public_id`` (``P-…``). ``selling_price``
        is the whole-packaging price; when omitted it is frozen to
        ``packets * product.selling_price`` (see
        ``aggregator.ProductOperations.add_packaging``).
      properties:
        product:
          type: string
          minLength: 1
        packet_weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,3})?$
        packets:
          type: integer
          minimum: 1
        selling_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
      - packet_weight
      - packets
      - product
    CreateProductRequest:
      type: object
      description: Request validation for creating a new ``Product``.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        crop:
          type: integer
        buying_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        selling_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
      - buying_price
      - crop
      - name
      - selling_price
    CreateSalesPersonRequest:
      type: object
      description: Request validation for creating a new ``SalesPerson`` (city only).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        phone_number:
          type: string
          minLength: 1
          maxLength: 10
        city:
          type: integer
      required:
      - city
      - name
      - phone_number
    CropPayload:
      type: object
      description: Output shape for one crop row.
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    CropRef:
      type: object
      description: Output shape for the ``crop`` reference on a product.
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    LoginRequest:
      type: object
      properties:
        phone_number:
          type: string
          minLength: 1
          maxLength: 10
        otp:
          type: string
          minLength: 1
          maxLength: 8
      required:
      - otp
      - phone_number
    LoginResponse:
      type: object
      description: Credentials returned after a successful TOTP exchange.
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/LoginUser'
      required:
      - token
      - user
    LoginUser:
      type: object
      description: The authenticated sales person, as returned by the login flow.
      properties:
        id:
          type: integer
        name:
          type: string
        phone_number:
          type: string
        role:
          type: string
      required:
      - id
      - name
      - phone_number
      - role
    PatchedUpdateAdminRequest:
      type: object
      description: |-
        Request validation for updating an ``Admin`` (name/email/phone/stock flag).

        Callers pass the ``Admin`` being edited as ``instance=`` so the phone
        uniqueness check excludes that user's own row.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        phone_number:
          type: string
          minLength: 1
          maxLength: 10
        can_update_stock_count:
          type: boolean
    PatchedUpdateCropRequest:
      type: object
      description: Request validation for updating a ``Crop`` (name only).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
    PatchedUpdateProductPackagingRequest:
      type: object
      description: Request validation for updating a ``ProductPackaging`` (all fields
        optional).
      properties:
        product:
          type: string
          minLength: 1
        packet_weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,3})?$
        packets:
          type: integer
          minimum: 1
        selling_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
    PatchedUpdateProductRequest:
      type: object
      description: Request validation for updating a ``Product`` (all fields optional).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        crop:
          type: integer
        buying_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        selling_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
    PatchedUpdateSalesPersonRequest:
      type: object
      description: |-
        Request validation for updating a ``SalesPerson`` (name/email/phone/city).

        Callers pass the ``SalesPerson`` being edited as ``instance=`` so the
        phone uniqueness check excludes that user's own row.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        phone_number:
          type: string
          minLength: 1
          maxLength: 10
        city:
          type: integer
    ProductPackagingPayload:
      type: object
      description: Output shape for one packaging row.
      properties:
        public_id:
          type: string
        product:
          $ref: '#/components/schemas/ProductRef'
        packet_weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,3})?$
        packets:
          type: integer
          minimum: 1
        total_weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,3})?$
        selling_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
      - packet_weight
      - packets
      - product
      - public_id
      - selling_price
      - total_weight
    ProductPayload:
      type: object
      description: Output shape for one product row.
      properties:
        public_id:
          type: string
        name:
          type: string
        crop:
          $ref: '#/components/schemas/CropRef'
        buying_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        selling_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        margin_per_packet:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
      - buying_price
      - crop
      - margin_per_packet
      - name
      - public_id
      - selling_price
    ProductRef:
      type: object
      description: Output shape for the ``product`` reference on a packaging.
      properties:
        public_id:
          type: string
        name:
          type: string
      required:
      - name
      - public_id
    ReauthenticateResponse:
      type: object
      description: |-
        Mirrors the fields ``VerifyOTPView`` returns on a fresh login.

        The client uses the capability booleans to decide which admin-management
        UI to show; surfacing them here keeps a long-lived session in step with
        a role change (e.g. an admin who was demoted after their initial login).
      properties:
        user:
          $ref: '#/components/schemas/ReauthenticateUser'
        can_create_admin:
          type: boolean
        can_create_sales_person:
          type: boolean
      required:
      - can_create_admin
      - can_create_sales_person
      - user
    ReauthenticateUser:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        phone_number:
          type: string
        role:
          type: string
      required:
      - id
      - name
      - phone_number
      - role
    SalesPersonPayload:
      type: object
      description: Swagger schema for one sales person row (city only).
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          nullable: true
        phone_number:
          type: string
        role:
          type: string
        created_by:
          allOf:
          - $ref: '#/components/schemas/UserRef'
          nullable: true
        created_at:
          type: string
          format: date-time
        city:
          allOf:
          - $ref: '#/components/schemas/CityRef'
          nullable: true
        totp:
          $ref: '#/components/schemas/Totp'
      required:
      - created_at
      - id
      - name
      - phone_number
      - role
    State:
      type: object
      description: Output shape for a state and its cities (schema only).
      properties:
        id:
          type: integer
        name:
          type: string
        cities:
          type: array
          items:
            $ref: '#/components/schemas/City'
      required:
      - cities
      - id
      - name
    Totp:
      type: object
      description: Swagger schema for a user's TOTP provisioning URI (used to render
        a QR code).
      properties:
        provisioning_uri:
          type: string
      required:
      - provisioning_uri
    UpdateClientRequest:
      type: object
      description: Request validation for a sales person's client update.
      properties:
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/ClientAddressRequest'
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/ClientContactRequest'
        transport_agencies:
          type: array
          items:
            $ref: '#/components/schemas/ClientTransportAgencyRequest'
        public_id:
          type: string
          minLength: 1
          maxLength: 20
      required:
      - addresses
      - contacts
      - public_id
      - transport_agencies
    UserRef:
      type: object
      description: Swagger schema for a compact ``{id, name}`` user reference.
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    VerifyClientRequest:
      type: object
      description: Request validation for verifying a client.
      properties:
        public_id:
          type: string
          minLength: 1
          maxLength: 20
      required:
      - public_id
    VerifyOTPRequest:
      type: object
      properties:
        phone_number:
          type: string
          minLength: 1
          maxLength: 10
        otp:
          type: string
          minLength: 1
          maxLength: 8
      required:
      - otp
      - phone_number
    VerifyOTPResponse:
      type: object
      description: |-
        User payload returned after a successful TOTP exchange.

        The session cookie itself is set via ``Set-Cookie`` (see ``login()``
        below), not returned in the body.
      properties:
        user:
          $ref: '#/components/schemas/VerifyOTPUser'
        can_create_admin:
          type: boolean
        can_create_sales_person:
          type: boolean
      required:
      - can_create_admin
      - can_create_sales_person
      - user
    VerifyOTPUser:
      type: object
      description: The authenticated user, as returned by the login flow.
      properties:
        id:
          type: integer
        name:
          type: string
        phone_number:
          type: string
        role:
          type: string
      required:
      - id
      - name
      - phone_number
      - role
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token
      description: Expiring bearer token used by the Android app.
    sessionAuth:
      type: apiKey
      in: header
      name: sessionid
      description: Django session cookie for the sales admin website.
