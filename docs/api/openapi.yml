      description: |-
        Output shape for the product a bag on an order *card* holds.

        Wider than ``packaging_payload``'s own ``product`` block by exactly one
        field: the picture the card renders. ``packaging_payload`` is left alone
        because it is embedded in every order payload and across the sales-admin
        API, where the image does not belong.
      properties:
        public_id:
          type: string
        name:
          type: string
        image_url:
          type: string
          description: 'The product''s picture: an absolute URL when deployed, a MEDIA_URL-relative
            path in development, empty when none is set.'
      required:
      - image_url
      - name
      - public_id
    OrderCounts:
      type: object
      properties:
        total:
          type: integer
        by_status:
          $ref: '#/components/schemas/OrderStatusCounts'
      required:
      - by_status
      - total
    OrderDetailPayload:
      type: object
      description: |-
        Output shape for one order in full (``order_detail_payload``).

        Identical to the Android booking response except that ``client`` carries the
        whole client -- every address and transport agency, each with its link id --
        rather than just the company name and GST number.
      properties:
        public_id:
          type: string
        client:
          $ref: '#/components/schemas/ClientPayload'
        delivery_address:
          type: string
        status:
          type: string
          nullable: true
        expected_delivery_date:
          type: string
          format: date
        actual_delivery_date:
          type: string
          format: date
          nullable: true
        special_comments:
          type: string
        transport_agency:
          allOf:
          - $ref: '#/components/schemas/TransportAgencyRef'
          nullable: true
        dispatch_mode:
          $ref: '#/components/schemas/DispatchModeEnum'
        verified_at:
          type: string
          format: date-time
          nullable: true
        total_amount:
          type: string
        total_packets:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemPayload'
        return_order:
          allOf:
          - $ref: '#/components/schemas/ReturnOrderPayload'
          nullable: true
          description: The order's live return (PENDING or ACCEPTED); null when it
            has none. A REJECTED return is not shown.
      required:
      - actual_delivery_date
      - client
      - delivery_address
      - dispatch_mode
      - expected_delivery_date
      - items
      - public_id
      - return_order
      - special_comments
      - status
      - total_amount
      - total_packets
      - transport_agency
      - verified_at
    OrderItemPayload:
      type: object
