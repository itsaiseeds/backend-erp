components:
  schemas:
    AcceptReturnOrderRequest:
      type: object
      description: |-
        Request body to accept a return.

        ``include_in_other_raw_materials`` is required: it is the admin's explicit
        choice to book the packing materials back too. ``recipe_public_ids`` is the
        flat list of the recipes to book them against (live or soft-deleted); it
        must be empty or omitted when the flag is false.
      properties:
        include_in_other_raw_materials:
          type: boolean
        recipe_public_ids:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 20
          description: OMR-… recipes to book packing material against, one per material
            type per line. Required (covering every line) when the flag is true.
      required:
      - include_in_other_raw_materials
    AdminOrderListCity:
      type: object
      description: Output shape for the ``city`` reference on an order card.
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    AdminOrderListClient:
      type: object
      description: Output shape for the ``client`` reference on an order card.
      properties:
        public_id:
          type: string
        company_name:
          type: string
      required:
      - company_name
      - public_id
    AdminOrderListItem:
      type: object
      description: Output shape for one order card (schema only).
      properties:
        public_id:
          type: string
        created_at:
          type: string
          format: date-time
        status:
          type: string
          nullable: true
        client:
          $ref: '#/components/schemas/AdminOrderListClient'
        client_created_by:
          type: string
          nullable: true
          description: Sales person who onboarded the client.
        created_by:
          type: string
          nullable: true
          description: Sales person who booked the order.
        verified_by:
          type: string
          nullable: true
          description: Sales admin who approved the order; null until verified.
        delivery_address:
          type: string
        special_comments:
          type: string
        city:
          allOf:
          - $ref: '#/components/schemas/AdminOrderListCity'
          nullable: true
        transport_agency:
          allOf:
          - $ref: '#/components/schemas/TransportAgencyRef'
          nullable: true
        dispatch_mode:
          $ref: '#/components/schemas/DispatchModeEnum'
        expected_delivery_date:
          type: string
          format: date
        total_amount:
          type: string
        total_packets:
          type: integer
        item_count:
          type: integer
        packagings:
          type: array
          items:
            $ref: '#/components/schemas/OrderCardPackaging'
      required:
      - city
      - client
      - client_created_by
      - created_at
      - created_by
      - delivery_address
      - dispatch_mode
      - expected_delivery_date
      - item_count
      - packagings
      - public_id
      - special_comments
      - status
      - total_amount
      - total_packets
      - transport_agency
      - verified_by
    AdminOrderListPage:
      type: object
      description: Output shape for the paginated envelope (schema only).
      properties:
        total_count:
          type: integer
        total_pages:
          type: integer
        next_page_number:
          type: integer
          nullable: true
        previous_page_number:
          type: integer
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/AdminOrderListItem'
        available_filters:
          type: array
          items:
            $ref: '#/components/schemas/FilterCatalogueEntry'
        available_sorts:
          type: array
          items:
            $ref: '#/components/schemas/SortCatalogueEntry'
      required:
      - available_filters
      - available_sorts
      - next_page_number
      - previous_page_number
      - results
      - total_count
      - total_pages
    AdminPayload:
