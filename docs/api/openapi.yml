        total_amount:
          type: string
        total_packets:
          type: integer
        item_count:
          type: integer
        packagings:
          type: array
          items:
            $ref: '#/components/schemas/OrderCardPackaging'
        verified:
          type: boolean
          description: Whether a sales admin has approved the order.
        verified_by:
          type: string
          nullable: true
