      properties:
        public_id:
          type: string
        name:
          type: string
        snapshot_date:
          type: string
          format: date
        lines:
          type: array
          items:
            $ref: '#/components/schemas/ProductLooseWeightLine'
      required:
      - lines
      - name
      - public_id
      - snapshot_date
    ProductLooseWeightLine:
      type: object
      description: Output shape for one packet-weight line of a product's loose position.
      properties:
        packet_weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,3})?$
        on_hand:
          type: integer
        reserved:
          type: integer
        consumed:
          type: integer
        available:
          type: integer
      required:
      - available
      - consumed
      - on_hand
      - packet_weight
      - reserved
    ProductPackagingPayload:
      type: object
      description: Output shape for one packaging row.
      properties:
        public_id:
          type: string
        product:
          $ref: '#/components/schemas/ProductRef'
        packet_weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,3})?$
        packets:
          type: integer
          minimum: 1
        total_weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,3})?$
        selling_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
      - packet_weight
      - packets
      - product
      - public_id
      - selling_price
      - total_weight
    ProductPayload:
      type: object
      description: Output shape for one product row.
      properties:
        public_id:
          type: string
        name:
          type: string
        crop:
          $ref: '#/components/schemas/CropRef'
        stage:
          $ref: '#/components/schemas/StageRef'
        selling_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Rate per kilogram; packet and bag prices derive from it and
            the weight sold.
        image_url:
          type: string
        description_items:
          type: array
          items:
            type: string
      required:
      - crop
      - description_items
      - image_url
      - name
      - public_id
      - selling_price
      - stage
    ProductRef:
      type: object
      description: Output shape for a ``{public_id, name}`` product reference.
      properties:
        public_id:
          type: string
        name:
          type: string
      required:
      - name
      - public_id
    RawMaterialStock:
      type: object
      description: Output shape for the whole incoming raw-material position.
      properties:
        as_of:
          type: string
          format: date
          description: The day the numbers are as of.
        lines:
          type: array
          items:
            $ref: '#/components/schemas/RawMaterialStockLine'
      required:
      - as_of
      - lines
    RawMaterialStockLine:
      type: object
      description: Output shape for one product's incoming position.
      properties:
        product:
          type: string
          description: Product public id.
        name:
          type: string
          description: Product name.
        incoming_kg:
          type: string
          description: Sum of in-use KG with a reached effective date.
        packed_kg:
