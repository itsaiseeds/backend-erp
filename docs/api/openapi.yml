          minLength: 1
          maxLength: 255
        city:
          type: integer
      required:
      - city
      - name
    CreateProductPackagingRequest:
      type: object
      description: |-
        Request validation for creating a new ``ProductPackaging``.

        ``product`` is addressed by its ``public_id`` (``P-…``). ``selling_price``
        is the whole-packaging price; when omitted it is frozen to
        ``packets * product.price_for_weight(packet_weight)`` -- the product's
        per-kilogram rate applied to one packet, times the packets in the bag (see
        ``aggregator.ProductOperations.add_packaging``).
      properties:
        product:
          type: string
          minLength: 1
        packet_weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,3})?$
        packets:
          type: integer
          minimum: 1
        selling_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
      - packet_weight
      - packets
      - product
    CreateProductRequest:
      type: object
      description: Request validation for creating a new ``Product``.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        crop:
          type: integer
        stage:
          type: integer
        selling_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Rate per kilogram; packet and bag prices derive from it and
            the weight sold.
        image:
          type: string
          format: binary
        description_items:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 255
          description: Feature bullets, in display order. Sending the list replaces
            it wholesale; [] clears it.
          maxItems: 30
      required:
      - crop
      - name
      - selling_price
      - stage
    CreateRecipeRequest:
      type: object
      description: Request validation for creating a new ``OtherMaterialRecipe``.
      properties:
        product:
          type: integer
        material_type:
          type: integer
        packet_weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,3})?$
          description: Weight of the covered packet, in kilograms (the product variant).
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,3})?$
          description: Multiples of the material per pack, in the material type's
            unit (2 leaflets, 2.000 kg cover, 5 litre).
      required:
      - material_type
      - packet_weight
      - product
      - quantity
