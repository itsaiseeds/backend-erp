      properties:
        public_id:
          type: string
        status:
          type: string
          description: RETURN_PENDING, RETURN_ACCEPTED or RETURN_REJECTED.
        return_date:
          type: string
          format: date
        created_at:
          type: string
          format: date-time
        order:
          $ref: '#/components/schemas/ReturnOrderRef'
        client:
          $ref: '#/components/schemas/ReturnClientRef'
        created_by:
          allOf:
          - $ref: '#/components/schemas/ReturnUserRef'
          nullable: true
          description: Sales person who raised it.
        verified_by:
          allOf:
          - $ref: '#/components/schemas/ReturnUserRef'
          nullable: true
          description: Sales admin who accepted it; null unless ACCEPTED.
        rejected_by:
          allOf:
          - $ref: '#/components/schemas/ReturnUserRef'
          nullable: true
