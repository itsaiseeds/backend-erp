openapi: 3.0.3
info:
  title: SaiSeeds ERP API
  version: 1.0.0
  description: Backend API for the SaiSeeds sales admin website and salesperson Android
    app. Auto-generated from the codebase.
paths:
  /api/sales_admin/auth/otp/verify:
    post:
      operationId: sales_admin_auth_otp_verify_create
      description: Validate a TOTP code, then (re)issue credentials for that user.
      tags:
      - sales_admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyOTP'
          description: ''
  /api/test-sentry/:
    get:
      operationId: test_sentry_retrieve
      description: |-
        Force a 500 so its traceback is captured by error tracking.

        Only a Django superuser may call it, to stop the public-facing endpoint
        from being exploited as a free exception spammer.
      tags:
      - test-sentry
      security:
      - tokenAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: test_sentry_create
      description: |-
        Force a 500 so its traceback is captured by error tracking.

        Only a Django superuser may call it, to stop the public-facing endpoint
        from being exploited as a free exception spammer.
      tags:
      - test-sentry
      security:
      - tokenAuth: []
      responses:
        '200':
          description: No response body
components:
  schemas:
    VerifyOTP:
      type: object
      properties:
        phone_number:
          type: string
          maxLength: 10
        otp:
          type: string
          maxLength: 8
      required:
      - otp
      - phone_number
    VerifyOTPRequest:
      type: object
      properties:
        phone_number:
          type: string
          minLength: 1
          maxLength: 10
        otp:
          type: string
          minLength: 1
          maxLength: 8
      required:
      - otp
      - phone_number
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
