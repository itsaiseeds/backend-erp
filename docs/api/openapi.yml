openapi: 3.0.3
info:
  title: SaiSeeds ERP API
  version: 1.0.0
  description: Backend API for the SaiSeeds sales admin website and salesperson Android
    app. Auto-generated from the codebase.
paths:
  /api/sales_admin/admins:
    get:
      operationId: sales_admin_admins_retrieve
      description: List (GET) or create (POST) application admins.
      tags:
      - sales_admin
      security:
      - bearerAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAdmin'
          description: ''
    post:
      operationId: sales_admin_admins_create
      description: List (GET) or create (POST) application admins.
      tags:
      - sales_admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdminRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateAdminRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateAdminRequest'
        required: true
      security:
      - bearerAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAdmin'
          description: ''
  /api/sales_admin/auth/otp/verify:
    post:
      operationId: sales_admin_auth_otp_verify_create
      description: Validate a TOTP code, then (re)issue credentials for that user.
      tags:
      - sales_admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyOTPResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Invalid phone number or TOTP code.
          description: ''
  /api/sales_admin/sales-people:
    get:
      operationId: sales_admin_sales_people_retrieve
      description: List (GET) or create (POST) sales people.
      tags:
      - sales_admin
      security:
      - bearerAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSalesPerson'
          description: ''
    post:
      operationId: sales_admin_sales_people_create
      description: List (GET) or create (POST) sales people.
      tags:
      - sales_admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSalesPersonRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateSalesPersonRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateSalesPersonRequest'
        required: true
      security:
      - bearerAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSalesPerson'
          description: ''
  /api/utilities/cities:
    get:
      operationId: utilities_cities_list
      description: Public city look-up for the state -> city pickers.
      summary: List cities of a state
      parameters:
      - in: query
        name: state
        schema:
          type: string
        description: State name (case-insensitive), e.g. 'Maharashtra'.
        required: true
      tags:
      - utilities
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/City'
          description: ''
        '400':
          description: The 'state' query parameter is required.
        '404':
          description: No state matched the given name.
components:
  schemas:
    City:
      type: object
      description: Output shape for one city row (schema only; responses are built
        by hand).
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    CreateAdmin:
      type: object
      description: |-
        Validation for a new application ``Admin``.

        ``city`` is required because creating an admin also creates the fallback
        ``SalesPerson`` profile, which needs a city.
      properties:
        name:
          type: string
          maxLength: 255
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        phone_number:
          type: string
          maxLength: 10
        can_update_stock_count:
          type: boolean
          default: false
        city:
          type: integer
      required:
      - city
      - name
      - phone_number
    CreateAdminRequest:
      type: object
      description: |-
        Validation for a new application ``Admin``.

        ``city`` is required because creating an admin also creates the fallback
        ``SalesPerson`` profile, which needs a city.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        phone_number:
          type: string
          minLength: 1
          maxLength: 10
        can_update_stock_count:
          type: boolean
          default: false
        city:
          type: integer
      required:
      - city
      - name
      - phone_number
    CreateSalesPerson:
      type: object
      description: Validation for a new ``SalesPerson`` (city only, no address).
      properties:
        name:
          type: string
          maxLength: 255
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        phone_number:
          type: string
          maxLength: 10
        city:
          type: integer
      required:
      - city
      - name
      - phone_number
    CreateSalesPersonRequest:
      type: object
      description: Validation for a new ``SalesPerson`` (city only, no address).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        phone_number:
          type: string
          minLength: 1
          maxLength: 10
        city:
          type: integer
      required:
      - city
      - name
      - phone_number
    VerifyOTPRequest:
      type: object
      properties:
        phone_number:
          type: string
          minLength: 1
          maxLength: 10
        otp:
          type: string
          minLength: 1
          maxLength: 8
      required:
      - otp
      - phone_number
    VerifyOTPResponse:
      type: object
      description: Credentials returned after a successful TOTP exchange.
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/VerifyOTPUser'
        can_create_admin:
          type: boolean
        can_create_sales_person:
          type: boolean
      required:
      - can_create_admin
      - can_create_sales_person
      - token
      - user
    VerifyOTPUser:
      type: object
      description: The authenticated user, as returned by the login flow.
      properties:
        id:
          type: integer
        name:
          type: string
        phone_number:
          type: string
        role:
          type: string
      required:
      - id
      - name
      - phone_number
      - role
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token
      description: Expiring bearer token used by the Android app.
    sessionAuth:
      type: apiKey
      in: header
      name: sessionid
      description: Django session cookie for the sales admin website.
