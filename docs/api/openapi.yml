      summary: Replace the whole loose-stock count
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLooseStockRequest'
            examples:
              Whole-dayLooseCount:
                value:
                  counts:
                  - product: P-A1B2C3D4E0F1
                    packet_weight: '1.000'
                    packets: 12
                  - product: P-A1B2C3D4E0F1
                    packet_weight: '0.500'
                    packets: 0
                summary: Whole-day loose count
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UpdateLooseStockRequest'
          multipart/form-data:
            schema:
