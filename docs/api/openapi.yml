    ReauthenticateResponse:
      type: object
      description: |-
        Mirrors the fields ``VerifyOTPView`` returns on a fresh login.

        The client uses the capability booleans to decide which admin-management
        UI to show; surfacing them here keeps a long-lived session in step with
        a role change (e.g. an admin who was demoted after their initial login).
      properties:
        user:
          $ref: '#/components/schemas/ReauthenticateUser'
        can_create_admin:
          type: boolean
        can_create_sales_person:
          type: boolean
      required:
      - can_create_admin
      - can_create_sales_person
      - user
    ReauthenticateUser:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        phone_number:
          type: string
        role:
          type: string
      required:
      - id
      - name
      - phone_number
      - role
    RecipeListPage:
      type: object
      description: Output shape for the paginated envelope (schema only).
      properties:
        total_count:
          type: integer
        total_pages:
          type: integer
        next_page_number:
          type: integer
          nullable: true
        previous_page_number:
          type: integer
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/RecipePayload'
        available_filters:
          type: array
          items:
            $ref: '#/components/schemas/FilterCatalogueEntry'
        available_sorts:
          type: array
          items:
            $ref: '#/components/schemas/SortCatalogueEntry'
      required:
      - available_filters
      - available_sorts
      - next_page_number
      - previous_page_number
      - results
      - total_count
      - total_pages
    RecipeMaterialTypeRef:
      type: object
      description: Output shape for the ``material_type`` reference on a recipe.
      properties:
        id:
          type: integer
        name:
          type: string
        unit_type:
          type: string
      required:
      - id
      - name
      - unit_type
    RecipePayload:
      type: object
      description: Output shape for one recipe row.
      properties:
        public_id:
          type: string
        product:
          $ref: '#/components/schemas/RecipeProductRef'
        material_type:
          $ref: '#/components/schemas/RecipeMaterialTypeRef'
        packet_weight:
          type: string
          description: Weight of the covered packet, in kg.
        quantity:
          type: string
          description: Amount per pack, in the material type's unit.
      required:
      - material_type
      - packet_weight
      - product
      - public_id
      - quantity
    RecipeProductRef:
      type: object
      description: Output shape for the ``product`` reference on a recipe.
      properties:
        public_id:
          type: string
        name:
          type: string
      required:
      - name
      - public_id
    SalesPersonPayload:
      type: object
      description: Swagger schema for one sales person row (city only).
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          nullable: true
        phone_number:
          type: string
        role:
          type: string
        created_by:
          allOf:
          - $ref: '#/components/schemas/UserRef'
          nullable: true
        created_at:
          type: string
          format: date-time
        city:
          allOf:
          - $ref: '#/components/schemas/CityRef'
          nullable: true
        totp:
          $ref: '#/components/schemas/Totp'
      required:
      - created_at
      - id
      - name
      - phone_number
      - role
    SnapshotPayload:
      type: object
      description: Output shape for one recorded snapshot line.
      properties:
        public_id:
          type: string
        snapshot_date:
          type: string
          format: date
        packaging:
          $ref: '#/components/schemas/PackagingRef'
        bags:
          type: integer
          minimum: 0
        total_packets:
          type: integer
          minimum: 0
        total_weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,3})?$
        packets_available:
          type: integer
      required:
      - bags
      - packaging
      - packets_available
      - public_id
      - snapshot_date
      - total_packets
      - total_weight
    SortCatalogueEntry:
      type: object
      description: Schema for one ``available_sorts`` entry.
      properties:
        sort:
          type: string
          description: Send this in ?sort= ('-' prefix for descending).
        label:
          type: string
          description: Human-readable name for the menu entry.
        description:
          type: string
      required:
      - description
      - label
      - sort
    StageRef:
      type: object
      description: Output shape for the ``stage`` reference on a product.
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
      required:
      - code
      - id
      - name
    State:
      type: object
      description: Output shape for a state and its cities (schema only).
      properties:
        id:
          type: integer
        name:
          type: string
        cities:
          type: array
          items:
            $ref: '#/components/schemas/City'
      required:
      - cities
      - id
      - name
    StockAdmin:
      type: object
      description: Output shape for one admin authorised to record the daily count.
      properties:
        name:
          type: string
        phone_number:
          type: string
      required:
      - name
      - phone_number
    StockPayload:
      type: object
      description: Output shape for a stock position (bag or loose-packet line).
      properties:
        public_id:
          type: string
        name:
          type: string
        snapshot_date:
          type: string
          format: date
        on_hand:
          type: integer
        reserved:
          type: integer
        consumed:
          type: integer
        available:
          type: integer
      required:
      - available
      - consumed
      - on_hand
      - public_id
      - reserved
      - snapshot_date
    StockPosition:
      oneOf:
      - $ref: '#/components/schemas/StockPayload'
      - $ref: '#/components/schemas/ProductLooseStockPayload'
    Totp:
      type: object
      description: Swagger schema for a user's TOTP provisioning URI (used to render
        a QR code).
      properties:
        provisioning_uri:
          type: string
      required:
      - provisioning_uri
    TransportAgencyRef:
      type: object
      description: Output shape for the ``transport_agency`` reference on an order.
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    UnitTypeEnum:
      enum:
      - count
      - kg
      - litre
      type: string
      description: |-
        * `count` - count
        * `kg` - kg
        * `litre` - litre
    UpdateClientRequest:
      type: object
      description: Request validation for a sales person's client update.
      properties:
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/ClientAddressRequest'
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/ClientContactRequest'
        transport_agencies:
          type: array
          items:
            $ref: '#/components/schemas/ClientTransportAgencyRequest'
        public_id:
          type: string
          minLength: 1
          maxLength: 20
      required:
      - addresses
      - contacts
      - public_id
      - transport_agencies
    UpdateInwardRawMaterialStatusEnum:
      enum:
      - lab_testing
      - in_use
      type: string
      description: |-
        * `lab_testing` - lab testing
        * `in_use` - in use
    UpdateLooseStockRequest:
      type: object
      description: 'Request validation: a list of loose lines.'
      properties:
        counts:
          type: array
          items:
            $ref: '#/components/schemas/LooseCountLineRequest'
          description: Loose lines, one per (product, packet_weight) pair.
      required:
      - counts
    UpdateOrderStatusEnum:
      enum:
      - BOOKED
      - UNDER_REVIEW
      - CONFIRMED
      - DISPATCHED
      - DELIVERED
      - ON_HOLD
      - REJECTED
      type: string
      description: |-
        * `BOOKED` - BOOKED
        * `UNDER_REVIEW` - UNDER_REVIEW
        * `CONFIRMED` - CONFIRMED
        * `DISPATCHED` - DISPATCHED
        * `DELIVERED` - DELIVERED
        * `ON_HOLD` - ON_HOLD
        * `REJECTED` - REJECTED
    UpdateTodaysInventoryRequest:
      type: object
      description: |-
        Request validation: a map of packaging ``public_id`` → today's bag count.

        Bags only -- loose packets are never accepted here; they are recorded at
        ``/api/sales-admin/update-sample-packet-stock``.
      properties:
        counts:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
          description: Map of product-packaging public_id to its sealed-bag count;
            loose packets are recorded at ``update-sample-packet-stock``, not here.
      required:
      - counts
    UploadLRNumberRequest:
      type: object
      description: Request validation for recording an LR number.
      properties:
        lr_number:
          type: string
          minLength: 1
          description: The transporter's consignment note number.
          maxLength: 64
      required:
      - lr_number
    UserRef:
      type: object
      description: Swagger schema for a compact ``{id, name}`` user reference.
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    VerifyClientRequest:
      type: object
      description: Request validation for verifying a client.
      properties:
        public_id:
          type: string
          minLength: 1
          maxLength: 20
      required:
      - public_id
    VerifyOTPRequest:
      type: object
      properties:
        phone_number:
          type: string
          minLength: 1
          maxLength: 10
        otp:
          type: string
          minLength: 1
          maxLength: 8
      required:
      - otp
      - phone_number
    VerifyOTPResponse:
      type: object
      description: |-
        User payload returned after a successful TOTP exchange.

        The session cookie itself is set via ``Set-Cookie`` (see ``login()``
        below), not returned in the body.
      properties:
        user:
          $ref: '#/components/schemas/VerifyOTPUser'
        can_create_admin:
          type: boolean
        can_create_sales_person:
          type: boolean
      required:
      - can_create_admin
      - can_create_sales_person
      - user
    VerifyOTPUser:
      type: object
      description: The authenticated user, as returned by the login flow.
      properties:
        id:
          type: integer
        name:
          type: string
        phone_number:
          type: string
        role:
          type: string
      required:
      - id
      - name
      - phone_number
      - role
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token
      description: Expiring bearer token used by the Android app.
    sessionAuth:
      type: apiKey
      in: header
      name: sessionid
      description: Django session cookie for the sales admin website.
