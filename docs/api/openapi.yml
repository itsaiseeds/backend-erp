openapi: 3.0.3
info:
  title: SaiSeeds ERP API
  version: 1.0.0
  description: Backend API for the SaiSeeds sales admin website and salesperson Android
    app. Auto-generated from the codebase.
paths:
  /api/sales_admin/admins:
    get:
      operationId: sales_admin_admins_list
      description: List (GET) or create (POST) application admins (superuser only).
      summary: List application admins
      tags:
      - sales_admin
      security:
      - bearerAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminPayload'
          description: ''
    post:
      operationId: sales_admin_admins_create
      description: List (GET) or create (POST) application admins (superuser only).
      summary: Create an application admin (and a fallback sales person)
      tags:
      - sales_admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdminRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateAdminRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateAdminRequest'
        required: true
      security:
      - bearerAuth: []
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPayload'
          description: ''
  /api/sales_admin/auth/otp/verify:
    post:
      operationId: sales_admin_auth_otp_verify_create
      description: Validate a TOTP code, then (re)issue credentials for that user.
      tags:
      - sales_admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyOTPResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Invalid phone number or TOTP code.
          description: ''
  /api/sales_admin/sales-people:
    get:
      operationId: sales_admin_sales_people_list
      description: List (GET) or create (POST) sales people (app admin only).
      summary: List sales people
      tags:
      - sales_admin
      security:
      - bearerAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SalesPersonPayload'
          description: ''
    post:
      operationId: sales_admin_sales_people_create
      description: List (GET) or create (POST) sales people (app admin only).
      summary: Create a sales person
      tags:
      - sales_admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSalesPersonRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateSalesPersonRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateSalesPersonRequest'
        required: true
      security:
      - bearerAuth: []
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesPersonPayload'
          description: ''
  /api/utilities/cities:
    get:
      operationId: utilities_cities_list
      description: List Indian states, each with its cities, grouped by state.
      summary: List Indian states grouped with their cities
      tags:
      - utilities
      security:
      - bearerAuth: []
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/State'
          description: ''
components:
  schemas:
    AdminPayload:
      type: object
      description: Swagger schema for one admin row (no city, address or audit keys).
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          nullable: true
        phone_number:
          type: string
        role:
          type: string
        created_by:
          allOf:
          - $ref: '#/components/schemas/UserRef'
          nullable: true
        created_at:
          type: string
          format: date-time
        can_update_stock_count:
          type: boolean
        totp:
          $ref: '#/components/schemas/Totp'
      required:
      - can_update_stock_count
      - created_at
      - id
      - name
      - phone_number
      - role
    City:
      type: object
      description: Output shape for one city row (schema only; responses are built
        by hand).
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    CityRef:
      type: object
      description: Swagger schema for a compact ``{id, name}`` city reference.
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    CreateAdminRequest:
      type: object
      description: |-
        Request validation for creating a new application ``Admin``.

        ``city`` is required because creating an admin also creates the fallback
        ``SalesPerson`` profile, which needs a city.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        phone_number:
          type: string
          minLength: 1
          maxLength: 10
        can_update_stock_count:
          type: boolean
          default: false
        city:
          type: integer
          description: City for the fallback salesperson profile created with this
            admin.
      required:
      - city
      - name
      - phone_number
    CreateSalesPersonRequest:
      type: object
      description: Request validation for creating a new ``SalesPerson`` (city only).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        phone_number:
          type: string
          minLength: 1
          maxLength: 10
        city:
          type: integer
      required:
      - city
      - name
      - phone_number
    SalesPersonPayload:
      type: object
      description: Swagger schema for one sales person row (city only).
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          nullable: true
        phone_number:
          type: string
        role:
          type: string
        created_by:
          allOf:
          - $ref: '#/components/schemas/UserRef'
          nullable: true
        created_at:
          type: string
          format: date-time
        city:
          allOf:
          - $ref: '#/components/schemas/CityRef'
          nullable: true
        totp:
          $ref: '#/components/schemas/Totp'
      required:
      - created_at
      - id
      - name
      - phone_number
      - role
    State:
      type: object
      description: Output shape for a state and its cities (schema only).
      properties:
        id:
          type: integer
        name:
          type: string
        cities:
          type: array
          items:
            $ref: '#/components/schemas/City'
      required:
      - cities
      - id
      - name
    Totp:
      type: object
      description: Swagger schema for a user's TOTP provisioning URI (used to render
        a QR code).
      properties:
        provisioning_uri:
          type: string
      required:
      - provisioning_uri
    UserRef:
      type: object
      description: Swagger schema for a compact ``{id, name}`` user reference.
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    VerifyOTPRequest:
      type: object
      properties:
        phone_number:
          type: string
          minLength: 1
          maxLength: 10
        otp:
          type: string
          minLength: 1
          maxLength: 8
      required:
      - otp
      - phone_number
    VerifyOTPResponse:
      type: object
      description: Credentials returned after a successful TOTP exchange.
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/VerifyOTPUser'
        can_create_admin:
          type: boolean
        can_create_sales_person:
          type: boolean
      required:
      - can_create_admin
      - can_create_sales_person
      - token
      - user
    VerifyOTPUser:
      type: object
      description: The authenticated user, as returned by the login flow.
      properties:
        id:
          type: integer
        name:
          type: string
        phone_number:
          type: string
        role:
          type: string
      required:
      - id
      - name
      - phone_number
      - role
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token
      description: Expiring bearer token used by the Android app.
    sessionAuth:
      type: apiKey
      in: header
      name: sessionid
      description: Django session cookie for the sales admin website.
