openapi: 3.0.3
info:
  title: SaiSeeds ERP API
  version: 1.0.0
  description: Backend API for the SaiSeeds sales admin website and salesperson Android
    app. Auto-generated from the codebase.
paths:
  /api/sales_admin/admins:
    get:
      operationId: sales_admin_admins_retrieve
      description: List (GET) or create (POST) application admins.
      tags:
      - sales_admin
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAdmin'
          description: ''
    post:
      operationId: sales_admin_admins_create
      description: List (GET) or create (POST) application admins.
      tags:
      - sales_admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdminRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateAdminRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateAdminRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAdmin'
          description: ''
  /api/sales_admin/auth/otp/verify:
    post:
      operationId: sales_admin_auth_otp_verify_create
      description: Validate a TOTP code, then (re)issue credentials for that user.
      tags:
      - sales_admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyOTP'
          description: ''
  /api/sales_admin/sales-people:
    get:
      operationId: sales_admin_sales_people_retrieve
      description: List (GET) or create (POST) sales people.
      tags:
      - sales_admin
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSalesPerson'
          description: ''
    post:
      operationId: sales_admin_sales_people_create
      description: List (GET) or create (POST) sales people.
      tags:
      - sales_admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSalesPersonRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateSalesPersonRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateSalesPersonRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSalesPerson'
          description: ''
  /api/test-sentry/:
    get:
      operationId: test_sentry_retrieve
      description: |-
        Force a 500 so its traceback is captured by error tracking.

        Only a Django superuser may call it, to stop the public-facing endpoint
        from being exploited as a free exception spammer.
      tags:
      - test-sentry
      security:
      - tokenAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: test_sentry_create
      description: |-
        Force a 500 so its traceback is captured by error tracking.

        Only a Django superuser may call it, to stop the public-facing endpoint
        from being exploited as a free exception spammer.
      tags:
      - test-sentry
      security:
      - tokenAuth: []
      responses:
        '200':
          description: No response body
components:
  schemas:
    CreateAdmin:
      type: object
      description: |-
        Validation for a new application ``Admin``.

        ``city`` is required because creating an admin also creates the fallback
        ``SalesPerson`` profile, which needs a city.
      properties:
        name:
          type: string
          maxLength: 255
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        phone_number:
          type: string
          maxLength: 10
        can_update_stock_count:
          type: boolean
          default: false
        city:
          type: integer
      required:
      - city
      - name
      - phone_number
    CreateAdminRequest:
      type: object
      description: |-
        Validation for a new application ``Admin``.

        ``city`` is required because creating an admin also creates the fallback
        ``SalesPerson`` profile, which needs a city.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        phone_number:
          type: string
          minLength: 1
          maxLength: 10
        can_update_stock_count:
          type: boolean
          default: false
        city:
          type: integer
      required:
      - city
      - name
      - phone_number
    CreateSalesPerson:
      type: object
      description: Validation for a new ``SalesPerson`` (city only, no address).
      properties:
        name:
          type: string
          maxLength: 255
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        phone_number:
          type: string
          maxLength: 10
        city:
          type: integer
      required:
      - city
      - name
      - phone_number
    CreateSalesPersonRequest:
      type: object
      description: Validation for a new ``SalesPerson`` (city only, no address).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        phone_number:
          type: string
          minLength: 1
          maxLength: 10
        city:
          type: integer
      required:
      - city
      - name
      - phone_number
    VerifyOTP:
      type: object
      properties:
        phone_number:
          type: string
          maxLength: 10
        otp:
          type: string
          maxLength: 8
      required:
      - otp
      - phone_number
    VerifyOTPRequest:
      type: object
      properties:
        phone_number:
          type: string
          minLength: 1
          maxLength: 10
        otp:
          type: string
          minLength: 1
          maxLength: 8
      required:
      - otp
      - phone_number
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
