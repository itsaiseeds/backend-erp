    get:
      operationId: sales_admin_get_dispatch_challans
      description: List the delivery challans of dispatched orders and custom orders.
      summary: List dispatch challans (filter by client / destination city, sortable)
      parameters:
      - in: query
        name: all
        schema:
          type: boolean
          default: false
        description: When true, ignore page / page_size and return every row matching
          the filters as a single page (total_pages 1, page numbers null).
      - in: query
        name: challan_number
        schema:
          type: string
        description: Case-insensitive substring of the challan number (YYYYMMDD-XXXX).
          The date window still applies -- the number carries its own date. Single
          value; AND-ed with the other filters.
      - in: query
        name: city_id
        schema:
          type: string
        description: City id(s) the goods were sent to (see options). Comma-separated
          (any match); AND-ed with the other filters.
      - in: query
        name: client
        schema:
          type: string
        description: Client id(s) the goods were consigned to (see options). Comma-separated
          (any match); AND-ed with the other filters.
      - in: query
        name: end_date_time
        schema:
          type: string
          format: date-time
        description: ISO 8601. End date time of the window.
        required: true
      - in: query
        name: page
        schema:
          type: integer
        description: 1-based page number.
      - in: query
        name: page_size
        schema:
          type: integer
        description: Rows per page (default 10, max 100).
      - in: query
        name: public_id
        schema:
          type: string
        description: Case-insensitive substring of the public id (DE-XXXXXXXXXXXX).
          Single value; AND-ed with the other filters.
      - in: query
        name: sort
        schema:
          type: string
        description: Comma-separated sort keys (dispatch_date, created_at); prefix
          a key with '-' for descending. Defaults to the view's natural order.
      - in: query
        name: start_date_time
        schema:
          type: string
          format: date-time
        description: ISO 8601. Start date time of the window.
        required: true
      tags:
      - Admin · Dispatch
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchChallanPage'
          description: ''
