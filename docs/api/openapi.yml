          type: boolean
        verified_at:
          type: string
          format: date-time
          nullable: true
        verified_by:
          type: string
          nullable: true
        created_by:
          type: string
          nullable: true
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/ClientAddressPayload'
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/ClientContactPayload'
        transport_agencies:
          type: array
          items:
            $ref: '#/components/schemas/ClientTransportAgencyPayload'
      required:
      - addresses
      - company_name
      - company_phone
      - contacts
      - created_by
      - gst_number
      - is_verified
      - public_id
      - status
      - transport_agencies
      - verified_at
      - verified_by
    ClientTransportAgencyLink:
      type: object
      description: Output shape for one client-transport-agency link (schema only).
      properties:
        id:
          type: integer
          description: This link's id. Send it as client_transport_agency_id when
            creating an order.
        name:
          type: string
        is_primary:
          type: boolean
      required:
      - id
      - is_primary
      - name
    ClientTransportAgencyPayload:
      type: object
      description: Output shape for one client transport agency (schema only).
      properties:
        name:
          type: string
        is_primary:
          type: boolean
      required:
      - is_primary
      - name
    ClientTransportAgencyRequest:
      type: object
      description: One transport agency of a client -- a name and nothing else.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        is_primary:
          type: boolean
          default: false
      required:
      - name
    Country:
      type: object
      description: Output shape for one country row (schema only; responses are built
        by hand).
      properties:
        id:
          type: integer
        name:
          type: string
        iso_code:
          type: string
      required:
      - id
      - iso_code
      - name
    CreateAdminRequest:
      type: object
      description: |-
        Request validation for creating a new application ``Admin``.

        ``city`` is required because creating an admin also creates the fallback
        ``SalesPerson`` profile, which needs a city.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        phone_number:
          type: string
          minLength: 1
          maxLength: 10
        can_update_stock_count:
          type: boolean
          default: false
        city:
          type: integer
          description: City for the fallback salesperson profile created with this
            admin.
      required:
      - city
      - name
      - phone_number
    CreateClientRequest:
      type: object
      description: Request validation for creating a client with its three lists.
      properties:
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/ClientAddressRequest'
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/ClientContactRequest'
        transport_agencies:
          type: array
          items:
            $ref: '#/components/schemas/ClientTransportAgencyRequest'
        company_name:
          type: string
          minLength: 1
          maxLength: 255
        company_phone:
          type: string
          default: ''
          maxLength: 10
        gst_number:
          type: string
          minLength: 1
          maxLength: 15
      required:
      - addresses
      - company_name
      - contacts
      - gst_number
      - transport_agencies
    CreateCropRequest:
      type: object
      description: Request validation for creating a new ``Crop``.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
      required:
      - name
    CreateMultiSelectBagOrderRequest:
      type: object
      description: |-
        Request validation for booking a bag order.

        The address and the agency arrive as *link* ids, so each resolves with a
        single lookup scoped to the client -- an id belonging to somebody else
        simply does not match, and the "belongs to this client" rule
        ``Order.clean()`` enforces is satisfied by construction.
      properties:
        client_public_id:
          type: string
          minLength: 1
          maxLength: 20
        client_address_id:
          type: integer
          description: A link id from GET /android/api/v1/utilities/client-addresses.
        client_transport_agency_id:
          type: integer
          nullable: true
          description: A link id from GET /android/api/v1/utilities/client-transport-agencies.
            Omit or send null for a private (own-vehicle) dispatch.
        special_comments:
          type: string
          default: ''
        expected_delivery_date:
          type: string
          format: date
          nullable: true
          description: Defaults to the day after booking.
        items:
          type: array
          items:
            $ref: '#/components/schemas/BagOrderItemRequest'
      required:
      - client_address_id
      - client_public_id
      - items
    CreateProductPackagingRequest:
      type: object
      description: |-
        Request validation for creating a new ``ProductPackaging``.

        ``product`` is addressed by its ``public_id`` (``P-…``). ``selling_price``
        is the whole-packaging price; when omitted it is frozen to
        ``packets * product.price_for_weight(packet_weight)`` -- the product's
        per-kilogram rate applied to one packet, times the packets in the bag (see
        ``aggregator.ProductOperations.add_packaging``).
      properties:
        product:
          type: string
          minLength: 1
        packet_weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,3})?$
        packets:
          type: integer
          minimum: 1
        selling_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
      - packet_weight
      - packets
      - product
    CreateProductRequest:
      type: object
      description: Request validation for creating a new ``Product``.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        crop:
          type: integer
        stage:
          type: integer
        selling_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Rate per kilogram; packet and bag prices derive from it and
            the weight sold.
        image:
          type: string
          format: binary
        description_items:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 255
          description: Feature bullets, in display order. Sending the list replaces
            it wholesale; [] clears it.
          maxItems: 30
      required:
      - crop
      - name
      - selling_price
      - stage
    CreateSalesPersonRequest:
      type: object
      description: Request validation for creating a new ``SalesPerson`` (city only).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        phone_number:
          type: string
          minLength: 1
          maxLength: 10
        city:
          type: integer
      required:
      - city
      - name
      - phone_number
    CropPayload:
      type: object
      description: Output shape for one crop row.
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    CropRef:
      type: object
      description: Output shape for the ``crop`` reference on a product.
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    DispatchModeEnum:
      enum:
      - AGENCY
      - PRIVATE
      type: string
      description: |-
        * `AGENCY` - AGENCY
        * `PRIVATE` - PRIVATE
    FilterCatalogueEntry:
      type: object
      description: Schema for one ``available_filters`` entry.
      properties:
        filter:
          type: string
          description: 'Query param name (range filters: see params).'
        label:
          type: string
          description: Human-readable field name for the widget title.
        kind:
          type: string
          description: 'Widget hint: select, int, text, date, datetime, date_range,
            datetime_range, ...'
        description:
          type: string
        params:
          type: array
          items:
            type: string
          description: The query params this filter reads (range filters have two).
        options:
          type: array
          items:
            $ref: '#/components/schemas/FilterOption'
          description: Eligible choices, when the filter is closed-ended.
      required:
      - description
      - filter
      - kind
      - label
    FilterOption:
      type: object
      description: Schema for one ``{value, label}`` choice on a closed-ended filter.
      properties:
        value:
          description: Send this in the filter's query param.
        label:
          type: string
          description: Human-readable text for the picker.
      required:
      - label
      - value
    LoginRequest:
      type: object
