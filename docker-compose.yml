services:
  web:
    build: .
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env.dev
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    # Cap shared_buffers so postgres doesn't auto-tune to ~25% of host RAM and
    # OOM small CI runners that also run pytest.
    command: postgres -c timezone=UTC -c shared_buffers=128MB
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: django
      POSTGRES_USER: django
      POSTGRES_PASSWORD: change-this-password
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U django -d django" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
